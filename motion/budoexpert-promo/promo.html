<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>budoexpert Promo</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #1a0520; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; display: block; }
  #hint { position: fixed; bottom: 12px; left: 16px; color: #ffffff80; font: 12px Poppins, sans-serif; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">spacja: pauza · ←/→: przewijanie · klik: restart</div>
<script>
/* =====================================================================
   BUDOEXPERT — PROMO (26 s, 1920×1080, 60 fps)
   Deterministyczny render(t) → render.mjs renderuje go do MP4.
   Kolory wzięte z logo, font: Poppins.
   ===================================================================== */
const CFG = {
  W: 1920, H: 1080, FPS: 60, DUR: 25.6,
  C: {
    paper:  '#FFFFFF',
    grid:   '#EFE7F2',
    grid2:  '#E2D3E8',
    sketch: '#B79FC2',   // ołówek (przygaszony fiolet)
    ink:    '#2A0F30',
    purple: '#6C0C79',   // z logo
    purple2:'#520A5C',
    teal:   '#20CFA3',   // z logo
    teal2:  '#17A884',
    white:  '#FFFFFF',
  },
  font: 'Poppins',
};
const { W, H, C } = CFG;
let T = 0; // current render time (for pencil "boil")

/* ---------- math & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: (x, s = 1.70158) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
  spring: (x, f = 4.5, d = 5.5) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-d * x) * Math.cos(f * Math.PI * x),
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const pulse = (t, beats, k = 10) => { let v = 0; for (const b of beats) if (t >= b) v = Math.max(v, Math.exp(-(t - b) * k)); return v; };

/* ---------- canvas helpers ---------- */
function font(ctx, size, weight = 600, ls = 0) { ctx.font = `${weight} ${size}px "${CFG.font}"`; ctx.letterSpacing = ls + 'px'; }
function layout(ctx, str) {
  const out = [];
  for (let i = 0; i < str.length; i++) out.push({ ch: str[i], x: ctx.measureText(str.slice(0, i)).width, w: ctx.measureText(str[i]).width });
  out.total = ctx.measureText(str).width; return out;
}
function poly(ctx, pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
function dot(ctx, x, y, r, color) { if (r <= 0) return; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ring(ctx, x, y, r, lw, color) { if (r <= 0 || lw <= 0) return; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
/* reveal a line of text rising out of a mask */
function riseText(ctx, str, x, y, size, p, pout = 0, align = 'left') {
  if (p <= 0 || pout >= 1) return;
  const prevAlign = ctx.textAlign; ctx.textAlign = 'left';
  const w = ctx.measureText(str).width, x0 = align === 'center' ? x - w / 2 : x;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 40, y - size * 1.05, w + 80, size * 1.35); ctx.clip();
  ctx.fillText(str, x0, y + (1 - p) * size * 1.2 - pout * size * 1.3);
  ctx.restore(); ctx.textAlign = prevAlign;
}

/* ---------- pencil / architectural sketch primitives ---------- */
function qpt(a, m, b, u) { const v = 1 - u; return [v * v * a[0] + 2 * v * u * m[0] + u * u * b[0], v * v * a[1] + 2 * v * u * m[1] + u * u * b[1]]; }
function sLine(ctx, x1, y1, x2, y2, p = 1, o = {}) {
  if (p <= 0) return;
  const { w = 2, col = C.sketch, over = 12, seed = 1, amp = 1.4, passes = 2 } = o;
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const boil = Math.floor(T * 8);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  for (let k = 0; k < passes; k++) {
    const r = rng(seed * 131 + k * 17 + boil * 7919);
    const ov = p >= 1 ? 1 : 0;
    const a = [x1 - ux * over * r() * ov + (r() - .5) * amp * 2, y1 - uy * over * r() * ov + (r() - .5) * amp * 2];
    const b = [x2 + ux * over * r() * ov + (r() - .5) * amp * 2, y2 + uy * over * r() * ov + (r() - .5) * amp * 2];
    const m = [(a[0] + b[0]) / 2 - uy * (r() - .5) * amp * 3, (a[1] + b[1]) / 2 + ux * (r() - .5) * amp * 3];
    ctx.globalAlpha = k ? .4 : 1;
    ctx.beginPath(); const N = 14;
    for (let i = 0; i <= N; i++) { const q = qpt(a, m, b, i / N * p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function sPoly(ctx, pts, p = 1, o = {}, closed = false) {
  if (p <= 0) return;
  const q = closed ? [...pts, pts[0]] : pts, lens = [];
  let tot = 0; for (let i = 1; i < q.length; i++) { const l = Math.hypot(q[i][0] - q[i - 1][0], q[i][1] - q[i - 1][1]); lens.push(l); tot += l; }
  let d = tot * p;
  for (let i = 1; i < q.length && d > 0; i++) {
    const f = Math.min(1, d / lens[i - 1]); d -= lens[i - 1];
    sLine(ctx, q[i - 1][0], q[i - 1][1], q[i][0], q[i][1], f, { ...o, seed: (o.seed || 1) * 7 + i, over: o.over ?? 8 });
  }
}
function sArc(ctx, cx, cy, rx, ry, a0, a1, p = 1, o = {}) {
  if (p <= 0) return;
  const { w = 2, col = C.sketch, seed = 3, amp = 1.2, passes = 2, dash = null } = o;
  const boil = Math.floor(T * 8), N = Math.max(12, Math.ceil(Math.abs(a1 - a0) * Math.max(rx, ry) / 10));
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  for (let k = 0; k < passes; k++) {
    const r = rng(seed * 97 + k * 13 + boil * 1237), ph = r() * TAU, wob = amp * (1 + r()), off = (r() - .5) * 0.06;
    ctx.globalAlpha = k ? .4 : 1; ctx.beginPath();
    const end = a0 + (a1 - a0 + (p >= 1 ? .08 : 0)) * p;
    for (let i = 0; i <= N; i++) {
      const a = lerp(a0 + off, end, i / N), rr = 1 + Math.sin(a * 3 + ph) * wob / Math.max(rx, 1);
      const x = cx + Math.cos(a) * rx * rr, y = cy + Math.sin(a) * ry * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
}
/* icons: list of primitives in a 100×100 box centred on 0,0 */
const ICONS = {
  house: [['p', [[-40, 45], [-40, -5], [0, -42], [40, -5], [40, 45]], 1], ['l', -52, 45, 52, 45], ['r', -12, 15, 22, 30], ['r', 14, 2, 16, 16], ['p', [[22, -22], [22, -38], [31, -38], [31, -14]]], ['l', -40, 58, 40, 58], ['l', -40, 53, -40, 63], ['l', 40, 53, 40, 63]],
  crane: [['l', -30, 50, -30, -44], ['l', -20, 50, -20, -44], ['p', [[-30, 40], [-20, 28], [-30, 16], [-20, 4], [-30, -8], [-20, -20], [-30, -32]]], ['l', -46, -44, 48, -44], ['p', [[-25, -56], [-46, -44]]], ['p', [[-25, -56], [44, -44]]], ['r', -46, -42, 12, 9], ['l', 34, -44, 34, -8], ['a', 34, -3, 5, -Math.PI / 2, Math.PI], ['r', 2, 12, 40, 38], ['l', 2, 31, 42, 31], ['l', 22, 12, 22, 50], ['l', -50, 50, 50, 50]],
  helmet: [['a', 0, 12, 36, Math.PI, TAU], ['r', -48, 12, 96, 9], ['l', 0, -24, 0, 12], ['l', -12, -22, -12, 12], ['l', 12, -22, 12, 12], ['a', 0, 12, 22, Math.PI * 1.15, Math.PI * 1.85]],
  shop: [['r', -46, -32, 92, 14], ['a', -38.3, -18, 7.66, 0, Math.PI], ['a', -23, -18, 7.66, 0, Math.PI], ['a', -7.7, -18, 7.66, 0, Math.PI], ['a', 7.7, -18, 7.66, 0, Math.PI], ['a', 23, -18, 7.66, 0, Math.PI], ['a', 38.3, -18, 7.66, 0, Math.PI], ['r', -40, -10, 80, 55], ['r', -30, 12, 20, 33], ['r', 2, 4, 28, 20], ['r', -20, -50, 40, 14]],
  invest: [['l', -42, 46, -42, -42], ['l', -42, 46, 46, 46], ['p', [[-34, 30], [-12, 6], [4, 16], [38, -24]]], ['p', [[24, -25], [39, -25], [39, -10]]], ['a', 20, 30, 9, 0, TAU], ['l', -42, 20, -38, 20], ['l', -42, -6, -38, -6]],
  developer: [['r', -38, -44, 36, 90], ['r', 4, -14, 36, 60], ['r', -30, -34, 8, 8], ['r', -18, -34, 8, 8], ['r', -30, -18, 8, 8], ['r', -18, -18, 8, 8], ['r', -30, -2, 8, 8], ['r', -18, -2, 8, 8], ['r', 12, -4, 8, 8], ['r', 24, -4, 8, 8], ['r', 12, 12, 8, 8], ['r', 24, 12, 8, 8], ['l', -50, 46, 50, 46]],
  architect: [['a', 0, -38, 6, 0, TAU], ['l', -3, -32, -24, 42], ['l', 3, -32, 24, 42], ['l', -14, 6, 14, 6], ['a', 0, -32, 70, Math.PI * .36, Math.PI * .64], ['l', 0, -52, 0, -44]],
  pm: [['r', -32, -36, 64, 82], ['r', -12, -44, 24, 12], ['p', [[-22, -14], [-15, -7], [-4, -20]]], ['l', 4, -13, 22, -13], ['p', [[-22, 10], [-15, 17], [-4, 4]]], ['l', 4, 11, 22, 11], ['r', -22, 28, 12, 10], ['l', 4, 33, 22, 33]],
};
function icon(ctx, name, x, y, s, p, o = {}) {
  if (p <= 0) return;
  const list = ICONS[name], n = list.length;
  list.forEach((pr, i) => {
    const q = clamp(p * n - i * 0.75, 0, 1) ; // overlapping sequential draw
    if (q <= 0) return;
    const op = { ...o, seed: (o.seed || 5) * 31 + i, w: o.w || 3 };
    const X = v => x + v * s, Y = v => y + v * s;
    if (pr[0] === 'l') sLine(ctx, X(pr[1]), Y(pr[2]), X(pr[3]), Y(pr[4]), q, { ...op, over: 6 * s / 3 });
    else if (pr[0] === 'r') sPoly(ctx, [[X(pr[1]), Y(pr[2])], [X(pr[1] + pr[3]), Y(pr[2])], [X(pr[1] + pr[3]), Y(pr[2] + pr[4])], [X(pr[1]), Y(pr[2] + pr[4])]], q, { ...op, over: 4 * s / 3 }, true);
    else if (pr[0] === 'p') sPoly(ctx, pr[1].map(([a, b]) => [X(a), Y(b)]), q, { ...op, over: 4 * s / 3 }, !!pr[2]);
    else if (pr[0] === 'a') sArc(ctx, X(pr[1]), Y(pr[2]), pr[3] * s, pr[3] * s, pr[4], pr[5], q, { ...op, amp: .6 });
  });
}

/* ---------- camera shake ---------- */
const IMPACTS = [[0.55, 5], [1.05, 14], [6.32, 9], [12.0, 8], [14.0, 26], [19.0, 16], [22.0, 10], [24.5, 6]];
function shake(t) {
  let a = 0; for (const [ti, A] of IMPACTS) if (t >= ti) a += A * Math.exp(-(t - ti) * 9);
  return { x: a * Math.sin(t * 93.1) * Math.cos(t * 41.7), y: a * Math.cos(t * 77.3) * Math.sin(t * 29.9 + 1), r: a * 0.0006 * Math.sin(t * 61.3) };
}
function camera(ctx, t, s = 1, fx = W / 2, fy = H / 2, oy = 0) {
  const k = shake(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2 + k.x, H / 2 + k.y + oy); ctx.rotate(k.r); ctx.scale(s, s); ctx.translate(-fx, -fy);
}
/* graph-paper background (world-space, so page scrolls stay seamless) */
function paper(ctx, a = 1) {
  ctx.fillStyle = C.paper; ctx.fillRect(-W, -H, W * 3, H * 3);
  ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -W; x <= 2 * W; x += 30) { ctx.moveTo(x, -H); ctx.lineTo(x, 2 * H); }
  for (let y = -H; y <= 2 * H; y += 30) { ctx.moveTo(-W, y); ctx.lineTo(2 * W, y); }
  ctx.strokeStyle = hexA(C.grid, a); ctx.stroke();
  ctx.beginPath();
  for (let x = -W; x <= 2 * W; x += 150) { ctx.moveTo(x, -H); ctx.lineTo(x, 2 * H); }
  for (let y = -H; y <= 2 * H; y += 150) { ctx.moveTo(-W, y); ctx.lineTo(2 * W, y); }
  ctx.strokeStyle = hexA(C.grid2, a); ctx.stroke();
}
/* architectural title block, bottom-right */
function titleBlock(ctx, t, sheet, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a;
  const x = W - 60 - 360, y = H - 60 - 84;
  ctx.strokeStyle = hexA(C.purple, .55); ctx.lineWidth = 1.5; ctx.strokeRect(x, y, 360, 84);
  ctx.beginPath(); ctx.moveTo(x + 230, y); ctx.lineTo(x + 230, y + 84); ctx.moveTo(x, y + 42); ctx.lineTo(x + 360, y + 42); ctx.stroke();
  font(ctx, 13, 600, 2); ctx.fillStyle = hexA(C.purple, .8);
  ctx.fillText('PROJEKT: BUDOEXPERT', x + 12, y + 26);
  ctx.fillText(`ARKUSZ ${sheet}`, x + 244, y + 26);
  font(ctx, 13, 500, 2); ctx.fillStyle = hexA(C.purple, .6);
  ctx.fillText('RYNEK BUDOWLANY 2.0', x + 12, y + 68);
  ctx.fillText('SKALA 1:1', x + 244, y + 68);
  ctx.restore();
}

/* ---------- the logo (geometry measured from the brand file) ---------- */
const LOGO = { tri: [[399, 455], [478, 590], [320, 590]], tx: 530, base: 590, tw: 1048, cx: 961, cy: 522, reg: [1590, 452] };
let WM_SIZE = 190;
function roundedTri(v, r = 6, seg = 6) {
  const out = [];
  for (let i = 0; i < 3; i++) {
    const p = v[i], a = v[(i + 2) % 3], b = v[(i + 1) % 3];
    const ua = [(a[0] - p[0]), (a[1] - p[1])], ub = [(b[0] - p[0]), (b[1] - p[1])];
    const la = Math.hypot(...ua), lb = Math.hypot(...ub);
    const pa = [p[0] + ua[0] / la * r * 1.7, p[1] + ua[1] / la * r * 1.7], pb = [p[0] + ub[0] / lb * r * 1.7, p[1] + ub[1] / lb * r * 1.7];
    for (let k = 0; k <= seg; k++) out.push(qpt(pa, p, pb, k / seg));
  }
  return out;
}
function samplePoly(v, n) {
  const L = v.map((a, i) => { const b = v[(i + 1) % v.length]; return Math.hypot(b[0] - a[0], b[1] - a[1]); });
  const tot = L.reduce((a, b) => a + b, 0), out = [];
  for (let k = 0; k < n; k++) {
    let d = k / n * tot, i = 0; while (d > L[i] && i < L.length - 1) d -= L[i++];
    const a = v[i], b = v[(i + 1) % v.length], u = d / L[i]; out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]);
  }
  return out;
}
const NP = 150;
const TRI_PTS = (() => { // start the outline at the apex so it morphs cleanly from a circle
  const rt = roundedTri(LOGO.tri, 5, 6); const top = rt.reduce((m, p, i) => p[1] < rt[m][1] ? i : m, 0);
  return samplePoly([...rt.slice(top), ...rt.slice(0, top)], NP);
})();
const TRI_C = [399, 545];
function drawTri(ctx, color, dx = 0, dy = 0) { ctx.fillStyle = color; poly(ctx, TRI_PTS.map(([x, y]) => [x + dx, y + dy])); ctx.fill(); }
function drawReg(ctx, color, a = 1) {
  if (a <= 0) return;
  const [x, y] = LOGO.reg;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(a, a);
  ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.stroke();
  font(ctx, 13, 700); ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText('R', 0, 5); ctx.textAlign = 'left';
  ctx.restore();
}
/* static logo, placed with its centre at (cx, cy) */
function logo(ctx, cx, cy, s, triCol = C.teal, txtCol = C.purple, a = 1) {
  if (a <= 0 || s <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-LOGO.cx, -LOGO.cy);
  drawTri(ctx, triCol);
  font(ctx, WM_SIZE, 500); ctx.fillStyle = txtCol; ctx.fillText('budoexpert', LOGO.tx, LOGO.base);
  drawReg(ctx, txtCol, 1);
  ctx.restore();
}

/* =====================================================================
   SCENE 1 · 0.0–4.5 · kulka toczy się → trójkąt → dobija do napisu
   ===================================================================== */
const BALL_R = 58, BALL_Y = LOGO.base - BALL_R, BALL_X1 = 399, BALL_X0 = BALL_X1 - 2 * TAU * BALL_R; // two full turns → lands upright
const ROLL = 0.55, M1 = 0.8, HIT = 1.05;           // arrival, morph done, hit on the wordmark
const CIRC_PTS = Array.from({ length: NP }, (_, k) => { const a = -Math.PI / 2 + TAU * k / NP; return [Math.cos(a), Math.sin(a)]; });
function ballX(t) { return lerp(BALL_X0, BALL_X1, E.outCubic(P(t, 0, ROLL))); }
let WMC = null; // offscreen layer for the shine sweep on the wordmark
function scene1(ctx, t) {
  // logo group travels up for the tagline scene
  const up = E.inOutExpo(P(t, 2.1, 2.6));
  camera(ctx, t, lerp(1.12, 1.0, E.inOutCubic(P(t, 0, 1.0))), lerp(760, W / 2, E.inOutCubic(P(t, 0, 1.0))), H / 2);
  paper(ctx);

  // construction guides (fast)
  const gA = 1 - P(t, 1.6, 2.2);
  if (gA > 0) {
    ctx.save(); ctx.globalAlpha = gA;
    const g2 = E.outExpo(P(t, 0.0, 0.5)), g3 = E.outExpo(P(t, 0.06, 0.56));
    ctx.setLineDash([10, 8]);
    sLine(ctx, -W, LOGO.base, 2 * W, LOGO.base, 1, { col: C.sketch, w: 1.6, seed: 11, passes: 1 });
    sLine(ctx, W, 485, W - W * g2, 485, 1, { col: C.grid2, w: 1.4, seed: 12, passes: 1 });
    sLine(ctx, 0, 452, W * g3, 452, 1, { col: C.grid2, w: 1.4, seed: 13, passes: 1 });
    ctx.setLineDash([]);
    font(ctx, 14, 600, 3); ctx.fillStyle = hexA(C.sketch, P(t, 0.3, 0.5));
    ctx.fillText('BASELINE', 1640, LOGO.base - 10); ctx.fillText('X-HEIGHT', 1640, 478); ctx.fillText('ASCENDER', 1640, 445);
    sPoly(ctx, LOGO.tri, E.inOutCubic(P(t, 0.0, 0.35)), { col: C.sketch, w: 2, seed: 21 }, true);
    sLine(ctx, 399, 420, 399, 630, E.outCubic(P(t, 0.05, 0.3)), { col: C.grid2, w: 1.4, seed: 22, passes: 1 });
    sArc(ctx, TRI_C[0], TRI_C[1], 104, 104, -Math.PI * .9, Math.PI * .6, E.inOutCubic(P(t, 0.1, 0.45)), { col: C.grid2, w: 1.4, seed: 23, passes: 1 });
    const dm = E.outExpo(P(t, 0.9, 1.4));
    if (dm > 0) {
      const mx = LOGO.tx + LOGO.tw / 2, hw = LOGO.tw / 2 * dm;
      ctx.strokeStyle = hexA(C.teal2, .8); ctx.lineWidth = 1.6; ctx.beginPath();
      ctx.moveTo(mx - hw, 680); ctx.lineTo(mx + hw, 680); ctx.moveTo(mx - hw, 670); ctx.lineTo(mx - hw, 690); ctx.moveTo(mx + hw, 670); ctx.lineTo(mx + hw, 690); ctx.stroke();
      font(ctx, 16, 600, 3); ctx.fillStyle = hexA(C.teal2, P(t, 1.1, 1.35)); ctx.textAlign = 'center';
      ctx.fillText('1048 PX · POPPINS', mx, 716); ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  ctx.save();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t < 4.5) scene1(ctx, t);
  else if (t < 7.5) scene2(ctx, t);
  else if (t < 8.0) { // sketchbook page scroll
    const e = E.inOutExpo(P(t, 7.5, 8.0));
    scene2(ctx, t, -H * e);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.beginPath(); ctx.rect(0, H * (1 - e), W, H); ctx.clip();
    scene3(ctx, t, H * (1 - e)); ctx.restore();
  }
  else if (t < 12.0) scene3(ctx, t);
  else if (t < 12.4) { // iris into purple
    scene3(ctx, t);
    const r = 1150 * E.inOutCubic(P(t, 12.0, 12.35));
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ring(ctx, W / 2, H / 2, r + 30, 18, C.teal);
    ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, TAU); ctx.clip(); scene4(ctx, t); ctx.restore();
  }
  else if (t < 15.0) scene4(ctx, t);
  else if (t < 15.5) { // collapse into the hub
    const e = E.inOutExpo(P(t, 15.0, 15.5)), r = lerp(1150, HUB.r, e), k = r / 1150;
    scene5(ctx, t);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, TAU); ctx.clip();
    ctx.fillStyle = C.purple; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - P(t, 15.02, 15.22);
    ctx.translate(W / 2, H / 2); ctx.scale(k, k); ctx.translate(-W / 2, -H / 2); scene4content(ctx, t);
    ctx.restore();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = P(t, 15.25, 15.5); logo(ctx, HUB.x, HUB.y + 4, .19, C.teal, C.white); ctx.restore();
  }
  else if (t < 21.5) scene5(ctx, t);
  else if (t < 22.0) { // the pedestal top expands into the CTA
    scene5(ctx, t);
    const g3 = hub3D(t), e = E.inExpo(P(t, 21.5, 22.0)), r = lerp(g3.rx, 1500, e);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.beginPath(); ctx.ellipse(W / 2, g3.top, r, lerp(g3.ry, 1500, e), 0, 0, TAU); ctx.clip();
    ctx.fillStyle = C.purple; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - P(t, 21.5, 21.7); logo(ctx, W / 2, g3.top + 4, .19 * g3.k * (r / g3.rx), C.teal, C.white);
    ctx.restore();
  }
  else scene6(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const scn = mk(), sctx = scn.getContext('2d'), acc = mk(), actx = acc.getContext('2d');
function frame(t, samples = 1, shutter = .5) {
  const CUTS = [4.5, 7.5, 8.0, 12.0, 12.4, 15.0, 15.5, 21.5, 22.0];
  const tl0 = mapT(t);
  for (let i = 0; i < samples; i++) {
    let ts = t + (samples > 1 ? (i / samples) * shutter / CFG.FPS : 0);
    if (t < S1END && ts >= S1END) ts = S1END - 1e-4;
    ts = Math.min(ts, CFG.DUR - 1e-4);
    let tl = mapT(ts);
    for (const c of CUTS) if (tl0 < c && tl >= c) tl = c - 1e-4;
    renderScene(sctx, tl);
    actx.globalAlpha = 1 / (i + 1); actx.drawImage(scn, 0, 0);
  }
  actx.globalAlpha = 1;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.drawImage(acc, 0, 0);
  const sheet = tl0 < 7.75 ? '01' : tl0 < 12 ? '02' : '03';
  if ((tl0 >= 0.9 && tl0 < 12.0) || (tl0 >= 15.5 && tl0 < 19.5)) titleBlock(octx, tl0, sheet, tl0 < 1.3 ? P(tl0, 0.9, 1.3) : 1 - P(tl0, 19.2, 19.45));
  post(octx, tl0);
}

/* ---------- boot ---------- */
const EXPORT = new URLSearchParams(location.search).has('export');
window.renderFrameData = (f, samples = 8, q = .96) => { frame(f / CFG.FPS, samples); return out.toDataURL('image/jpeg', q); };
window.renderAt = (t, samples = 8) => { frame(t, samples); return true; };
window.DUR = CFG.DUR;
Promise.all([300, 400, 500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 100px "${CFG.font}"`, 'AaĄąĘęŁłŃńÓóŚśŹźŻż…?!0'))).then(() => document.fonts.ready).then(() => {
  // fit the wordmark to the width measured from the logo file
  const m = document.createElement('canvas').getContext('2d'); font(m, 100, 500);
  WM_SIZE = 100 * LOGO.tw / m.measureText('budoexpert').width;
  window.ready = true;
  if (EXPORT) { document.getElementById('hint').remove(); return; }
  let t0 = performance.now(), paused = false, pt = 0;
  const now = () => paused ? pt : ((performance.now() - t0) / 1000) % CFG.DUR;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { if (paused) { t0 = performance.now() - pt * 1000; paused = false; } else { pt = now(); paused = true; } }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const d = e.code === 'ArrowRight' ? 1 / 60 : -1 / 60; const n = (now() + (paused ? d : d * 30) + CFG.DUR) % CFG.DUR; if (paused) pt = n; else t0 = performance.now() - n * 1000; }
  });
  out.addEventListener('click', () => { t0 = performance.now(); paused = false; });
  const loop = () => { frame(now(), 2); requestAnimationFrame(loop); };
  loop();
});
</script>
