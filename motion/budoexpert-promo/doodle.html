<script>
/* =====================================================================
   BUDOEXPERT — PROMO „DOODLE” (30,55 s, 1920×1080, 60 fps)
   Ta sama historia i ten sam soundtrack co v1 (soundtrack.wav), ale w stylu
   odręcznego szkicu: podwójne, „gotujące się” kontury, serduszka, strzałki,
   iskierki i dopiski odręcznym fontem (Caveat). Wszystkie czasy w sekundach filmu.
   ===================================================================== */
const CFG = { W: 1920, H: 1080, FPS: 60, DUR: 30.55 };
const C = {
  paper:  '#FCFBF8',
  purple: '#6C0C79',   // z logo
  purple2:'#520A5C',
  teal:   '#20CFA3',   // z logo
  teal2:  '#17A884',
  white:  '#FFFFFF',
  ink:    '#3A0B45',
};
const { W, H } = CFG;
let BT = 0;   // frame time — drives the line "boil", identical for every motion-blur sample

/* ---------- math & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: (x, s = 1.70158) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const pulse = (t, beats, k = 10) => { let v = 0; for (const b of beats) if (t >= b) v = Math.max(v, Math.exp(-(t - b) * k)); return v; };
const boil = (rate = 8) => Math.floor(BT * rate);
function qpt(a, m, b, u) { const v = 1 - u; return [v * v * a[0] + 2 * v * u * m[0] + u * u * b[0], v * v * a[1] + 2 * v * u * m[1] + u * u * b[1]]; }

/* ---------- canvas helpers ---------- */
function font(ctx, size, weight = 600, ls = 0) { ctx.font = `${weight} ${size}px "Poppins"`; ctx.letterSpacing = ls + 'px'; }
function layout(ctx, str) {
  const out = [];
  for (let i = 0; i < str.length; i++) out.push({ ch: str[i], x: ctx.measureText(str.slice(0, i)).width, w: ctx.measureText(str[i]).width });
  out.total = ctx.measureText(str).width; return out;
}
function poly(ctx, pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }

/* ---------- hand-drawn ink ----------
   A path is resampled, wobbled along its normal (low-frequency, so it reads as a hand, not noise)
   and drawn twice: a main stroke and a thinner, slightly misregistered second pass. The wobble
   re-rolls 8× a second — the classic "boiling line" of hand-drawn animation. */
function resample(pts, step = 6) {
  const out = [pts[0]], s = [0]; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / step));
    for (let k = 1; k <= n; k++) { out.push([lerp(x0, x1, k / n), lerp(y0, y1, k / n)]); acc += L / n; s.push(acc); }
  }
  out.s = s; out.len = acc; return out;
}
function ink(ctx, pts, p = 1, o = {}) {
  if (p <= 0 || !pts || pts.length < 2) return;
  const { col = C.purple, w = 4, seed = 1, amp = 1.6, passes = 2, off = 3, closed = false, rate = 8, alpha2 = .7, dash = null, fill = null } = o;
  const q = resample(closed ? [...pts, pts[0]] : pts, 6), end = q.len * clamp(p), ga = ctx.globalAlpha;
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (dash) ctx.setLineDash(dash);
  for (let k = 0; k < passes; k++) {
    const r = rng(seed * 977 + k * 131 + boil(rate) * 7919);
    const ph1 = r() * TAU, ph2 = r() * TAU, f1 = .012 + r() * .01, f2 = .045 + r() * .02;
    const ox = k ? (r() - .5) * 2 * off : 0, oy = k ? (r() - .5) * 2 * off : 0;
    const at = (x, y, i, s) => {
      const a = q[Math.max(0, i - 1)], b = q[Math.min(q.length - 1, i + 1)];
      let nx = a[1] - b[1], ny = b[0] - a[0]; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      const d = amp * (Math.sin(s * f1 + ph1) + .5 * Math.sin(s * f2 + ph2));
      return [x + nx * d + ox, y + ny * d + oy];
    };
    ctx.lineWidth = k ? w * .6 : w; ctx.globalAlpha = ga * (k ? alpha2 : 1);
    ctx.beginPath();
    for (let i = 0; i < q.length; i++) {
      if (q.s[i] > end) {
        const u = (end - q.s[i - 1]) / (q.s[i] - q.s[i - 1] || 1);
        const [x, y] = at(lerp(q[i - 1][0], q[i][0], u), lerp(q[i - 1][1], q[i][1], u), i, end); ctx.lineTo(x, y); break;
      }
      const [x, y] = at(q[i][0], q[i][1], i, q.s[i]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    if (fill && k === 0 && p >= 1) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.stroke();
  }
  ctx.restore();
}
/* shapes (point lists) */
const ellipsePts = (cx, cy, rx, ry, a0 = -Math.PI / 2, sweep = TAU, n = 64, spiral = 0) =>
  Array.from({ length: n + 1 }, (_, i) => { const u = i / n, a = a0 + sweep * u, k = 1 + spiral * u; return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]; });
const heartPts = (cx, cy, s) => Array.from({ length: 49 }, (_, i) => {
  const t = TAU * i / 48, x = 16 * Math.pow(Math.sin(t), 3), y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return [cx + x * s / 16, cy - y * s / 16];
});
function sparklePts(cx, cy, s) {
  const pts = [];
  for (let k = 0; k < 4; k++) {
    const a0 = -Math.PI / 2 + k * Math.PI / 2, a1 = a0 + Math.PI / 2;
    const A = [cx + Math.cos(a0) * s, cy + Math.sin(a0) * s], B = [cx + Math.cos(a1) * s, cy + Math.sin(a1) * s];
    const M = [cx + Math.cos(a0 + Math.PI / 4) * s * .14, cy + Math.sin(a0 + Math.PI / 4) * s * .14];
    for (let i = 0; i < 8; i++) pts.push(qpt(A, M, B, i / 8));
  }
  return pts;
}
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function heart(ctx, cx, cy, s, p, o = {}) { ink(ctx, heartPts(cx, cy, s), p, { w: 3, passes: 1, ...o }); }
function heartFill(ctx, cx, cy, s, col) { ctx.fillStyle = col; poly(ctx, heartPts(cx, cy, s)); ctx.fill(); }
function sparkle(ctx, cx, cy, s, k, o = {}) { if (k <= 0) return; ink(ctx, sparklePts(cx, cy, s * k), 1, { w: 3, passes: 1, closed: true, amp: .6, ...o }); }
function burst(ctx, cx, cy, angs, r0, r1, p, o = {}) {
  angs.forEach((a, i) => {
    const q = P(p, i * .12, i * .12 + .6); if (q <= 0) return;
    const c = Math.cos(a), s = Math.sin(a);
    ink(ctx, [[cx + c * r0, cy + s * r0], [cx + c * lerp(r0, r1, q), cy + s * lerp(r0, r1, q)]], 1, { w: 3.5, passes: 1, seed: i + 7 * (o.seed || 1), ...o });
  });
}
function arrow(ctx, x0, y0, x1, y1, bend, p, o = {}) {
  if (p <= 0) return;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, c = [(x0 + x1) / 2 - dy / L * bend, (y0 + y1) / 2 + dx / L * bend];
  ink(ctx, Array.from({ length: 25 }, (_, i) => qpt([x0, y0], c, [x1, y1], i / 24)), P(p, 0, .75), { w: 3.5, passes: 1, ...o });
  const hp = P(p, .7, 1); if (hp <= 0) return;
  const a = Math.atan2(y1 - c[1], x1 - c[0]), hl = o.head ?? 24;
  for (const s of [1, -1]) { const b = a + Math.PI - s * .5; ink(ctx, [[x1, y1], [x1 + Math.cos(b) * hl, y1 + Math.sin(b) * hl]], hp, { w: 3.5, passes: 1, ...o, seed: (o.seed || 1) + s * 3 }); }
}
function smiley(ctx, cx, cy, r, p, o = {}) {
  ink(ctx, ellipsePts(cx, cy, r, r, -2, TAU * 1.04, 48), P(p, 0, .6), { w: 3.5, passes: 1, ...o });
  for (const s of [-1, 1]) ink(ctx, [[cx + s * r * .33, cy - r * .32], [cx + s * r * .33, cy - r * .08]], P(p, .55, .7), { w: 4, passes: 1, ...o });
  ink(ctx, ellipsePts(cx, cy + r * .02, r * .52, r * .45, .45, 2.24, 16), P(p, .65, 1), { w: 3.5, passes: 1, ...o });
}
/* handwritten note, written on left→right, each line nudged right like real handwriting */
function hand(ctx, str, x, y, size, p, o = {}) {
  if (p <= 0) return;
  const { col = C.purple, rot = 0, align = 'left', lh = .95, indent = .45 } = o;
  const r = rng(Math.round(x * 7 + y) + boil(6) * 13);
  ctx.save(); ctx.translate(x + (r() - .5) * 1.6, y + (r() - .5) * 1.6); ctx.rotate(rot + (r() - .5) * .01);
  ctx.font = `700 ${size}px "Caveat"`; ctx.letterSpacing = '0px'; ctx.fillStyle = col;
  const lines = str.split('\n'), ws = lines.map(l => ctx.measureText(l).width), tot = ws.reduce((a, b) => a + b, 0);
  let rem = tot * clamp(p);
  lines.forEach((l, i) => {
    if (rem <= 0) return;
    const w = ws[i], x0 = (align === 'center' ? -w / 2 : 0) + i * size * indent, ly = i * size * lh;
    ctx.save(); ctx.beginPath(); ctx.rect(x0 - 10, ly - size, Math.min(rem, w) + (rem >= w ? 40 : 4), size * 1.5); ctx.clip();
    ctx.fillText(l, x0, ly); ctx.restore(); rem -= w;
  });
  ctx.restore();
}
/* a glyph with a sketchy, offset outline (the halo cuts thin gaps through the fill, like the logo drawings) */
function sketchGlyph(ctx, ch, x, y, fill, line, halo, off, lw, seed) {
  ctx.fillStyle = fill; ctx.fillText(ch, x, y);
  if (!line) return;
  const r = rng(seed * 31 + boil() * 101), dx = off[0] + (r() - .5) * 2.6, dy = off[1] + (r() - .5) * 2.6;
  ctx.lineJoin = 'round';
  if (halo) { ctx.strokeStyle = halo; ctx.lineWidth = lw + 3.5; ctx.strokeText(ch, x + dx, y + dy); }
  ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.strokeText(ch, x + dx, y + dy);
}
/* a line of text whose letters pop in one by one (parts share a baseline) */
function popText(ctx, parts, cx, y, t, t0, o = {}) {
  const { stagger = .03, dur = .32, halo = C.paper, off = [-5, -4], lw = 2.4, align = 'center', back = 2.2 } = o;
  let total = 0; const segs = [];
  for (const p of parts) { font(ctx, p.size, p.w); const L = layout(ctx, p.s); segs.push({ p, L, x: total }); total += L.total; }
  const x0 = align === 'center' ? cx - total / 2 : cx; let idx = 0;
  for (const sg of segs) {
    font(ctx, sg.p.size, sg.p.w);
    sg.L.forEach((ch, j) => {
      const st = sg.p.t0 != null ? sg.p.t0 + j * (sg.p.st ?? stagger) : t0 + idx * stagger; idx++;
      const q = P(t, st, st + dur); if (q <= 0 || ch.ch === ' ') return;
      const k = E.outBack(q, back);
      ctx.save(); ctx.translate(x0 + sg.x + ch.x + ch.w / 2, y); ctx.scale(k, k);
      sketchGlyph(ctx, ch.ch, -ch.w / 2, 0, sg.p.fill, sg.p.line, halo, off, sg.p.lw ?? lw, idx * 7 + j);
      ctx.restore();
    });
  }
  return { x0, total, segs: segs.map(s => ({ x: x0 + s.x, w: s.L.total })) };
}

/* ---------- icons (same drawings as v1), 100×100 box centred on 0,0 ---------- */
const ICONS = {
  house: [['p', [[-40, 45], [-40, -5], [0, -42], [40, -5], [40, 45]], 1], ['l', -52, 45, 52, 45], ['r', -12, 15, 22, 30], ['r', 14, 2, 16, 16], ['p', [[22, -22], [22, -38], [31, -38], [31, -14]]], ['l', -40, 58, 40, 58], ['l', -40, 53, -40, 63], ['l', 40, 53, 40, 63]],
  crane: [['l', -30, 50, -30, -44], ['l', -20, 50, -20, -44], ['p', [[-30, 40], [-20, 28], [-30, 16], [-20, 4], [-30, -8], [-20, -20], [-30, -32]]], ['l', -46, -44, 48, -44], ['p', [[-25, -56], [-46, -44]]], ['p', [[-25, -56], [44, -44]]], ['r', -46, -42, 12, 9], ['l', 34, -44, 34, -8], ['a', 34, -3, 5, -Math.PI / 2, Math.PI], ['r', 2, 12, 40, 38], ['l', 2, 31, 42, 31], ['l', 22, 12, 22, 50], ['l', -50, 50, 50, 50]],
  helmet: [['a', 0, 12, 36, Math.PI, TAU], ['r', -48, 12, 96, 9], ['l', 0, -24, 0, 12], ['l', -12, -22, -12, 12], ['l', 12, -22, 12, 12], ['a', 0, 12, 22, Math.PI * 1.15, Math.PI * 1.85]],
  shop: [['r', -46, -32, 92, 14], ['a', -38.3, -18, 7.66, 0, Math.PI], ['a', -23, -18, 7.66, 0, Math.PI], ['a', -7.7, -18, 7.66, 0, Math.PI], ['a', 7.7, -18, 7.66, 0, Math.PI], ['a', 23, -18, 7.66, 0, Math.PI], ['a', 38.3, -18, 7.66, 0, Math.PI], ['r', -40, -10, 80, 55], ['r', -30, 12, 20, 33], ['r', 2, 4, 28, 20], ['r', -20, -50, 40, 14]],
  invest: [['l', -42, 46, -42, -42], ['l', -42, 46, 46, 46], ['p', [[-34, 30], [-12, 6], [4, 16], [38, -24]]], ['p', [[24, -25], [39, -25], [39, -10]]], ['a', 20, 30, 9, 0, TAU], ['l', -42, 20, -38, 20], ['l', -42, -6, -38, -6]],
  developer: [['r', -38, -44, 36, 90], ['r', 4, -14, 36, 60], ['r', -30, -34, 8, 8], ['r', -18, -34, 8, 8], ['r', -30, -18, 8, 8], ['r', -18, -18, 8, 8], ['r', -30, -2, 8, 8], ['r', -18, -2, 8, 8], ['r', 12, -4, 8, 8], ['r', 24, -4, 8, 8], ['r', 12, 12, 8, 8], ['r', 24, 12, 8, 8], ['l', -50, 46, 50, 46]],
  architect: [['a', 0, -38, 6, 0, TAU], ['l', -3, -32, -24, 42], ['l', 3, -32, 24, 42], ['l', -14, 6, 14, 6], ['a', 0, -32, 70, Math.PI * .36, Math.PI * .64], ['l', 0, -52, 0, -44]],
  hammer: [['p', [[-30, -44], [24, -44], [34, -34], [24, -24], [-30, -24], [-36, -34]], 1], ['l', -36, -34, -46, -34], ['r', -4, -24, 12, 70], ['l', -4, 34, 8, 34]],
  wrench: [['a', -22, -22, 22, Math.PI * 1.25 + .5, Math.PI * 3.25 - .5], ['p', [[-14, -2], [-2, -14], [40, 28], [28, 40]], 1], ['a', 34, 34, 4, 0, TAU]],
  shield: [['p', [[0, -44], [36, -30], [34, 6], [0, 44], [-34, 6], [-36, -30]], 1], ['p', [[-14, 0], [-3, 12], [18, -12]]], ['l', -22, -22, 22, -22]],
  tag: [['p', [[-42, 0], [0, -42], [40, -42], [40, 0], [0, 42]], 1], ['a', 22, -24, 6, 0, TAU], ['a', -8, -2, 6, 0, TAU], ['a', 10, 16, 6, 0, TAU], ['l', -12, 20, 14, -6]],
  bubble: [['p', [[-42, -32], [42, -32], [42, 20], [2, 20], [-18, 40], [-14, 20], [-42, 20]], 1], ['a', -18, -6, 4, 0, TAU], ['a', 0, -6, 4, 0, TAU], ['a', 18, -6, 4, 0, TAU]],
  route: [['p', [[-38, 36], [-12, 12], [8, 24], [32, -16]]], ['a', -38, 36, 6, 0, TAU], ['l', 32, -16, 32, -46], ['p', [[32, -46], [50, -39], [32, -32]], 1]],
  pm: [['r', -32, -36, 64, 82], ['r', -12, -44, 24, 12], ['p', [[-22, -14], [-15, -7], [-4, -20]]], ['l', 4, -13, 22, -13], ['p', [[-22, 10], [-15, 17], [-4, 4]]], ['l', 4, 11, 22, 11], ['r', -22, 28, 12, 10], ['l', 4, 33, 22, 33]],

function icon(ctx, name, x, y, s, p, o = {}) {
  if (p <= 0) return;
  const list = ICONS[name], n = list.length;
  list.forEach((pr, i) => {
    const q = clamp(p * n - i * .75); if (q <= 0) return;
    const op = { w: 4, passes: 1, amp: 1, ...o, seed: (o.seed || 5) * 31 + i };
    const X = v => x + v * s, Y = v => y + v * s;
    if (pr[0] === 'l') ink(ctx, [[X(pr[1]), Y(pr[2])], [X(pr[3]), Y(pr[4])]], q, op);
    else if (pr[0] === 'r') ink(ctx, rectPts(X(pr[1]), Y(pr[2]), pr[3] * s, pr[4] * s), q, { ...op, closed: true });
    else if (pr[0] === 'p') ink(ctx, pr[1].map(([a, b]) => [X(a), Y(b)]), q, { ...op, closed: !!pr[2] });
    else if (pr[0] === 'a') ink(ctx, ellipsePts(X(pr[1]), Y(pr[2]), pr[3] * s, pr[3] * s, pr[4], pr[5] - pr[4], 32), q, { ...op, amp: .5 });
  });

/* ---------- backgrounds, grain, camera ---------- */
function bg(ctx, col) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore(); }
const GR = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), d = g.createImageData(256, 256), r = rng(9);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
function grain(ctx, a) {
  const r = rng(boil(12) + 5);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(-Math.floor(r() * 256), -Math.floor(r() * 256)); ctx.fillStyle = ctx.createPattern(GR, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}
const IMPACTS = [[0.95, 14], [4.35, 7], [10.1, 5], [12.1, 24], [18.15, 12], [22.55, 9], [25.55, 7], [28.0, 5]];
function shake(t) {
  let a = 0; for (const [ti, A] of IMPACTS) if (t >= ti) a += A * Math.exp(-(t - ti) * 9);
  return { x: a * Math.sin(t * 93.1) * Math.cos(t * 41.7), y: a * Math.cos(t * 77.3) * Math.sin(t * 29.9 + 1), r: a * 0.0006 * Math.sin(t * 61.3) };
}

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2 + k.x + ox, H / 2 + k.y + oy); ctx.rotate(k.r); ctx.translate(-W / 2, -H / 2);

let WM_SIZE = 190, WM_L = [];
function roundedTri(v, r = 6, seg = 6) {
  const out = [];
  for (let i = 0; i < 3; i++) {
    const p = v[i], a = v[(i + 2) % 3], b = v[(i + 1) % 3];
    const ua = [a[0] - p[0], a[1] - p[1]], ub = [b[0] - p[0], b[1] - p[1]], la = Math.hypot(...ua), lb = Math.hypot(...ub);
    const pa = [p[0] + ua[0] / la * r * 1.7, p[1] + ua[1] / la * r * 1.7], pb = [p[0] + ub[0] / lb * r * 1.7, p[1] + ub[1] / lb * r * 1.7];
    for (let k = 0; k <= seg; k++) out.push(qpt(pa, p, pb, k / seg));
  }
  return out;
}
const TRI_C = [392, 545];
const TRI_PTS = roundedTri(LOGO.tri, 6, 6);
const TRI_OUT = roundedTri(LOGO.tri.map(([x, y]) => [TRI_C[0] + (x - TRI_C[0]) * 1.17 - 8, TRI_C[1] + (y - TRI_C[1]) * 1.17 + 3]), 3, 4);

    ctx.fillStyle = tri; poly(ctx, TRI_PTS); ctx.fill(); ctx.restore();

}

/* =====================================================================
   6 · 18.55–25.05 · hub: wszystkie role wokół platformy (papier)
   ===================================================================== */
const ROLES = [
  { n: 'Inwestor', ic: 'invest' }, { n: 'Deweloper', ic: 'developer' }, { n: 'Architekt', ic: 'architect' },

const HUB_R = 150, RX = 660, RY = 320;
const rolePos = i => { const a = -Math.PI / 2 + i * TAU / 10; return [Math.cos(a) * RX, Math.sin(a) * RY]; };
function hubGroup(t) { const e = E.inOutCubic(P(t, 22.85, 23.45)); return { g: lerp(1, .58, e), y: lerp(540, 795, e) }; }

/* =====================================================================

const CONF = (() => { const r = rng(23); return Array.from({ length: 26 }, (_, i) => ({ a: -Math.PI / 2 + (r() - .5) * 2.6, v: 650 + r() * 650, k: i % 3, c: r() < .5 ? C.teal : C.white, s: 12 + r() * 14, sp: (r() - .5) * 8 })); })();

    const o = []; for (let i = 0; i <= 64; i++) { const a = i / 64 * TAU, c = Math.cos(a), s = Math.sin(a); o.push([Math.sign(c) * (BTN.w / 2 - 63) + c * 63 + 10, s * 63 + 9]); }
    ink(ctx, o, 1, { col: C.teal, w: 4.5, seed: 201, closed: true });
    font(ctx, 54, 700); ctx.fillStyle = C.purple; ctx.textAlign = 'center'; ctx.fillText('Zapisz się', 0, 19); ctx.textAlign = 'left';
    ctx.restore();
  }
  const wc = { col: C.white };
  hand(ctx, 'tutaj!', 395, 620, 70, P(t, 26.6, 26.9), { col: C.white, rot: -.1 });

    ctx.save(); ctx.translate(cx, cy); ctx.scale(ck * 1.15, ck * 1.15);
    const cp = [[0, 0], [0, 62], [16, 48], [28, 74], [39, 69], [27, 43], [47, 43]];
    ctx.fillStyle = C.white; poly(ctx, cp); ctx.fill();
    ink(ctx, cp, 1, { col: C.purple2, w: 3, closed: true, passes: 1, seed: 207, amp: .6 });

}
function sEnd(ctx, t, oy = 0) {

  ink(ctx, Array.from({ length: 21 }, (_, i) => qpt([712, 684], [900, 650], [1085, 646], i / 20)), E.inOutCubic(P(t, 29.12, 29.4)), { ...wc, w: 4, seed: 223 });
  // URL typed on

  arrow(ctx, 455, 300, 545, 392, -30, P(t, 29.45, 29.8), { ...wc, seed: 226 });
  smiley(ctx, 1240, 300, 42, P(t, 29.3, 29.65), { ...wc, seed: 227 });
  burst(ctx, 1240, 300, [-1.15, -.7, -.25], 60, 94, P(t, 29.5, 29.7), { ...wc, seed: 228 });

/* =====================================================================
   compositor
   ===================================================================== */
function renderScene(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t < 2.1) { bg(ctx, C.paper); s1(ctx, t); }
  else if (t < 2.6) { bg(ctx, C.paper); const e = E.inOutExpo(P(t, 2.1, 2.6)); s1(ctx, t, -H * e); s2(ctx, t, H * (1 - e)); }
  else if (t < 6.1) { bg(ctx, C.paper); s2(ctx, t); markerWipe(ctx, P(t, 5.6, 6.05), C.purple); }
  else if (t < 9.8) { bg(ctx, C.purple); s3(ctx, t); }
  else if (t < 10.1) { // hand-drawn iris back to paper
    bg(ctx, C.purple); s3(ctx, t);
    const r = 1150 * E.inOutCubic(P(t, 9.8, 10.08));
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, TAU); ctx.clip(); bg(ctx, C.paper); s4(ctx, t); ctx.restore();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ink(ctx, ellipsePts(W / 2, H / 2, r + 14, r + 12, 0, TAU * 1.02, 120), 1, { col: C.teal, w: 12, seed: 240 });
  }
  else if (t < 12.1) { bg(ctx, C.paper); s4(ctx, t); }
  else if (t < 13.1) { bg(ctx, C.purple); sRev(ctx, t); }
  else if (t < 18.55) { bg(ctx, C.purple); sCards(ctx, t); }
  else if (t < 25.05) {
    bg(ctx, C.paper); sHub(ctx, t);
    if (t < 19.05) { // the purple page shrinks into the hub's core
      const e = E.inOutExpo(P(t, 18.55, 19.05)), r = lerp(1200, HUB_R, e);
      ctx.save(); camera(ctx, t); ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, TAU); ctx.clip();
      ctx.fillStyle = C.purple; ctx.fillRect(-100, -100, W + 200, H + 200);
      dLogo(ctx, W / 2, H / 2 + 4 * e, lerp(.75, .22, e), { txt: C.white, line: C.white, bgc: C.purple });
      ctx.restore();
    }
  }
  else if (t < 25.55) { // the core blooms into the CTA page
    bg(ctx, C.paper); sHub(ctx, t);
    const { g, y } = hubGroup(t), e = E.inExpo(P(t, 25.05, 25.5)), r = lerp(HUB_R * g, 1800, e);
    ctx.save(); camera(ctx, t); ctx.beginPath(); ctx.arc(W / 2, y, r, 0, TAU); ctx.clip();
    ctx.fillStyle = C.purple; ctx.fillRect(-100, -100, W + 200, H + 200);
    ctx.globalAlpha = 1 - P(t, 25.05, 25.3); dLogo(ctx, W / 2, y + 4 * g, .22 * g * (r / (HUB_R * g)), { txt: C.white, line: C.white, bgc: C.purple });
    ctx.restore();
  }
  else if (t < 28.5) { bg(ctx, C.purple); sCta(ctx, t); }
  else if (t < 28.85) { bg(ctx, C.purple); const e = E.inOutExpo(P(t, 28.5, 28.85)); sCta(ctx, t, -H * e); sEnd(ctx, t, H * (1 - e)); }
  else { bg(ctx, C.purple); sEnd(ctx, t); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const scn = mk(), sctx = scn.getContext('2d'), acc = mk(), actx = acc.getContext('2d');
const CUTS = [6.1, 12.1, 13.1, 18.55, 25.05, 25.55];
function frame(t, samples = 1, shutter = .5) {
  BT = t;
  for (let i = 0; i < samples; i++) {
    let ts = Math.min(t + (samples > 1 ? (i / samples) * shutter / CFG.FPS : 0), CFG.DUR - 1e-4);
    for (const c of CUTS) if (t < c && ts >= c) ts = c - 1e-4;
    renderScene(sctx, ts);
    actx.globalAlpha = 1 / (i + 1); actx.drawImage(scn, 0, 0);
  }
  actx.globalAlpha = 1;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.drawImage(acc, 0, 0);
  grain(octx, .07);
}

/* ---------- boot ---------- */
const EXPORT = new URLSearchParams(location.search).has('export');
window.renderFrameData = (f, samples = 8, q = .96) => { frame(f / CFG.FPS, samples); return out.toDataURL('image/jpeg', q); };
window.renderAt = (t, samples = 8) => { frame(t, samples); return true; };
window.DUR = CFG.DUR;
Promise.all([
  ...[400, 500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 100px "Poppins"`, 'AaĄąĘęŁłŃńÓóŚśŹźŻż…?!0')),
  document.fonts.load('700 100px "Caveat"', 'AaĄąĘęŁłŃńÓóŚśŹźŻż…?!0'),
]).then(() => document.fonts.ready).then(() => {
  const m = document.createElement('canvas').getContext('2d'); font(m, 100, 600);
  WM_SIZE = 100 * LOGO.tw / m.measureText('budoexpert').width;
  font(m, WM_SIZE, 600); WM_L = layout(m, 'budoexpert');
  window.ready = true;
  if (EXPORT) { document.getElementById('hint').remove(); return; }
  let t0 = performance.now(), paused = false, pt = 0;
  const now = () => paused ? pt : ((performance.now() - t0) / 1000) % CFG.DUR;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { if (paused) { t0 = performance.now() - pt * 1000; paused = false; } else { pt = now(); paused = true; } }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const d = e.code === 'ArrowRight' ? 1 / 60 : -1 / 60; const n = (now() + (paused ? d : d * 30) + CFG.DUR) % CFG.DUR; if (paused) pt = n; else t0 = performance.now() - n * 1000; }
  });
  out.addEventListener('click', () => { t0 = performance.now(); paused = false; });
  const loop = () => { frame(now(), 1); requestAnimationFrame(loop); };
  loop();
});
