<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dwa światy budowania</title>
<link rel="stylesheet" href="../budoexpert-promo/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; display: block; }
  #hint { position: fixed; bottom: 12px; left: 16px; color: #ffffff80; font: 12px Poppins, sans-serif; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">spacja: pauza · ←/→: przewijanie · klik: restart</div>
<script src="timeline.js"></script>
<script>
/* =====================================================================
   BUDOEXPERT — „Dwa światy budowania” (storyboard v3, 1920×1080, 25 kl/s)
   Deterministyczny render(t) → render.mjs renderuje go do MP4.
   Oś czasu (start i długość ujęć) liczy voiceover.py z długości kwestii lektora.
   Ujęcia: funkcje SH['01A'](ctx, u, d), u = czas od początku ujęcia, d = jego długość.
   ===================================================================== */
const W = 1920, H = 1080, FPS = window.TL.fps, DUR = window.TL.dur;
const Q = new URLSearchParams(location.search);
const SUBS = Q.get('subs') === '1';

/* Dźwięki zsynchronizowane z obrazem: [czas od początku ujęcia, nazwa, (długość)].
   soundtrack.py czyta ten blok, więc to jedyne miejsce, gdzie są te czasy. */
const CUES = /*CUES*/{
  "00A": [[0.15, "pencil", 2.9], [0.35, "pianoWarm"]],
  "00B": [[0.0, "drops", 3.0]],
  "01B": [[2.7, "sigh"]],
  "02A": [[0.0, "lampHum", 3.0]],
  "02B": [[0.55, "hit"], [1.25, "hit"], [1.95, "hit"]],
  "03A": [[0.7, "calc"], [0.95, "calc"], [1.15, "calc"], [1.3, "calc"], [3.6, "scribble", 1.3]],
  "03B": [[0.0, "childBreath", 3.0]],
  "03C": [[0.35, "sent"]],
  "04B": [[0.1, "phoneTone", 1.1], [1.0, "counter", 2.6]],
  "05A": [[3.2, "whoosh"]],
  "05B": [[0.25, "bell"], [3.1, "doorShut"]],
  "06B": [[0.9, "ding"]],
  "06C": [[0.0, "swell"]],
  "07A": [[1.1, "pop"]],
  "07B": [[1.7, "popCheck"], [2.6, "msgDing"]],
  "08A": [[0.3, "bright"], [0.75, "bright"], [1.2, "bright"], [2.2, "pop"]],
  "08B": [[0.85, "clap"]],
  "09A": [[0.0, "plane", 2.6], [1.3, "buzz", 1.6]],
  "09B": [[1.5, "tap"], [1.65, "confirm"]],
  "09C": [[0.7, "clink"], [1.9, "clink"], [2.6, "clink"]],
  "10A": [[0.0, "truck", 1.7], [0.3, "birds", 3.5], [1.7, "hiss"]],
  "10B": [[0.6, "popCheck"]],
  "11A": [[0.3, "msgDing"], [2.6, "click"], [2.65, "popCheck"]],
  "11B": [[0.4, "beep"], [1.1, "beep"]],
  "12A": [[0.6, "plink"], [0.9, "plink"], [1.2, "plink"], [1.5, "plink"]],
  "12B": [[0.0, "whoosh"], [0.9, "chordHit"]]
}/*END*/;
const cue = (id, i) => CUES[id][i][0];

/* ---------- paleta ---------- */
const O = { paper: '#E3E6EA', wall: '#C5CBD2', shadow: '#6E7884', night: '#2B323C', line: '#3B404B', rain: '#7D91A6',
  lamp: '#D8CFA2', alarm: '#9C5D5D', skin: '#CBC5BE', ink: '#3B404B' };
const N = { paper: '#FFF8F0', grid: '#F5E6D8', grid2: '#EED6C4', purple: '#6C0C79', purple2: '#520A5C', teal: '#20CFA3', teal2: '#17A884',
  sun: '#FFD38A', lamp: '#FFC978', ink: '#3B1442', skin: '#F6CBA6', cream: '#FCEBDB', lav: '#F3E6F5', wood: '#DDAA70' };

/* postacie: te same osoby w obu światach */
const CH = {
  inwestorka: { old: { hair: 'long', hairCol: '#6E6863', top: '#7F8B86', legs: '#4A5059', skin: O.skin, ink: O.ink },
                new: { hair: 'long', hairCol: '#8A4B2C', top: N.teal, legs: '#3B2440', skin: N.skin, ink: N.ink } },
  inwestor:   { old: { hair: 'short', hairCol: '#4B505A', top: '#5F6774', legs: '#454B55', skin: O.skin, ink: O.ink },
                new: { hair: 'short', hairCol: '#6B3A22', top: N.purple, legs: '#3B2440', skin: N.skin, ink: N.ink } },
  wykonawca:  { old: { hair: 'cap', hairCol: '#55595F', hatCol: '#5F6368', top: '#8A8273', legs: '#454B55', skin: O.skin, ink: O.ink },
                new: { hair: 'cap', hairCol: '#5B3420', hatCol: '#3B1442', top: '#E6A63C', legs: '#3B2440', skin: N.skin, ink: N.ink } },
  sprzedawca: { old: { hair: 'short', hairCol: '#55595F', top: '#A3A8A3', apron: '#6F7A72', legs: '#454B55', skin: O.skin, ink: O.ink },
                new: { hair: 'short', hairCol: '#7A4426', top: '#F2ECE6', apron: N.purple2, legs: '#3B2440', skin: N.skin, ink: N.ink } },
  ekipa:      { old: { hair: 'hard', hairCol: '#55595F', hatCol: '#B4AD98', top: '#7D8693', legs: '#454B55', skin: O.skin, ink: O.ink },
                new: { hair: 'hard', hairCol: '#5B3420', hatCol: '#F4C431', top: '#9C7BB4', legs: '#3B2440', skin: N.skin, ink: N.ink } },
  dziecko:    { old: { hair: 'short', hairCol: '#5A5F66', top: '#8A939C', legs: '#454B55', skin: O.skin, ink: O.ink },
                new: { hair: 'short', hairCol: '#5B3420', top: '#F2896B', legs: '#3B2440', skin: N.skin, ink: N.ink } },
  partnerka:  { new: { hair: 'long', hairCol: '#8A4B2C', top: '#E9A0BC', legs: '#3B2440', skin: N.skin, ink: N.ink } },
};
const who = (k, world, extra = {}) => Object.assign({}, CH[k][world], extra);

/* ---------- matematyka ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outQuad: x => 1 - (1 - x) * (1 - x), inQuad: x => x * x,
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10), outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outBack: (x, s = 1.70158) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  spring: (x, f = 4.5, d = 5.5) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-d * x) * Math.cos(f * Math.PI * x),
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex2 = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const rgba = (h, a = 1) => { const [r, g, b] = hex2(h); return `rgba(${r},${g},${b},${a})`; };
const mix = (h1, h2, t) => { const a = hex2(h1), b = hex2(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], clamp(t))).toString(16).padStart(2, '0')).join(''); };
const shade = (h, k) => k < 0 ? mix(h, '#000000', -k) : mix(h, '#ffffff', k);

/* ---------- rysowanie: podstawy ---------- */
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(ctx, x, y, w, h, r, col) { ctx.fillStyle = col; rr(ctx, x, y, w, h, r); ctx.fill(); }
function circ(ctx, x, y, r, col) { if (r <= 0) return; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ring(ctx, x, y, r, lw, col) { if (r <= 0) return; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
function line(ctx, x1, y1, x2, y2, lw, col) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(ctx, pts, col) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); if (col) { ctx.fillStyle = col; ctx.fill(); } }
function txt(ctx, s, x, y, size, weight, col, align = 'left', ls = 0) {
  ctx.font = `${weight} ${size}px Poppins`; ctx.letterSpacing = ls + 'px'; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}
function tw(ctx, s, size, weight) { ctx.font = `${weight} ${size}px Poppins`; ctx.letterSpacing = '0px'; return ctx.measureText(s).width; }
function zoom(ctx, z, fx = W / 2, fy = H / 2) { ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx, -fy); }
function popScale(ctx, k, x, y) { ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y); }
function grid(ctx, bg, minor, major, step = 36, x0 = 0, y0 = 0, w = W, h = H) {
  ctx.fillStyle = bg; ctx.fillRect(x0, y0, w, h);
  for (const [col, every] of [[minor, 1], [major, 5]]) {
    ctx.strokeStyle = col; ctx.lineWidth = every > 1 ? 1.6 : 1; ctx.beginPath();
    for (let i = 0, x = x0; x <= x0 + w; x += step, i++) if (i % every === 0) { ctx.moveTo(Math.round(x) + .5, y0); ctx.lineTo(Math.round(x) + .5, y0 + h); }
    for (let i = 0, y = y0; y <= y0 + h; y += step, i++) if (i % every === 0) { ctx.moveTo(x0, Math.round(y) + .5); ctx.lineTo(x0 + w, Math.round(y) + .5); }
    ctx.stroke();
  }
}
function vgrad(ctx, y0, y1, c0, c1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
function glow(ctx, x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }

/* deszcz: deterministyczne smugi */
function rain(ctx, t, o = {}) {
  const { n = 200, col = O.rain, a = .55, len = 44, lw = 2.2, slant = .2, speed = 1700, seed = 7, w = W, h = H } = o;
  const r = rng(seed);
  ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha *= a; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x0 = r() * (w + 500) - 100, y0 = r() * (h + 200), sp = speed * (.75 + .5 * r()), L = len * (.6 + .7 * r());
    const span = h + L + 100;
    const y = ((y0 + sp * t) % span + span) % span - L;
    const x = x0 - slant * y;
    ctx.moveTo(x, y); ctx.lineTo(x - slant * L, y + L);
  }
  ctx.stroke(); ctx.restore();
}

/* logo: turkusowy trójkąt z zaokrąglonymi rogami + napis */
function triPath(ctx, cx, cy, R, round = .2) {
  const p = [-90, 30, 150].map(a => [cx + R * Math.cos(a * Math.PI / 180), cy + R * Math.sin(a * Math.PI / 180)]);
  const rad = R * round, m = [(p[0][0] + p[2][0]) / 2, (p[0][1] + p[2][1]) / 2];
  ctx.beginPath(); ctx.moveTo(m[0], m[1]);
  ctx.arcTo(p[0][0], p[0][1], p[1][0], p[1][1], rad); ctx.arcTo(p[1][0], p[1][1], p[2][0], p[2][1], rad); ctx.arcTo(p[2][0], p[2][1], p[0][0], p[0][1], rad);
  ctx.closePath();
}
function tri(ctx, cx, cy, R, col, round) { triPath(ctx, cx, cy, R, round); ctx.fillStyle = col; ctx.fill(); }
function logo(ctx, x, y, size, triCol = N.teal, txtCol = '#fff', align = 'center', a = 1) {
  const R = size * .6, triW = R * Math.sqrt(3), gap = size * .26, w = tw(ctx, 'budoexpert', size, 600), total = triW + gap + w;
  const x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const base = y + size * .36;
  ctx.save(); ctx.globalAlpha *= a;
  tri(ctx, x0 + triW / 2, base - R / 2 - size * .02, R, triCol, .16);
  txt(ctx, 'budoexpert', x0 + triW + gap, base, size, 600, txtCol);
  ctx.restore();
  return total;
}
function check(ctx, x, y, r, k = 1, bg = N.teal, fg = '#fff') {
  if (k <= 0) return;
  ctx.save(); popScale(ctx, k, x, y); circ(ctx, x, y, r, bg);
  ctx.strokeStyle = fg; ctx.lineWidth = r * .24; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .42, y + r * .02); ctx.lineTo(x - r * .1, y + r * .33); ctx.lineTo(x + r * .45, y - r * .3); ctx.stroke();
  ctx.restore();
}
function star(ctx, x, y, r, col) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * .45 : r; ctx.lineTo(x + rr_ * Math.cos(a), y + rr_ * Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function clock(ctx, x, y, r, h, m, sec, o = {}) {
  const face = o.face || '#D5D9DE', rim = o.rim || O.shadow, hand = o.hand || O.line;
  circ(ctx, x, y, r, face); ring(ctx, x, y, r - r * .06, r * .12, rim);
  for (let i = 0; i < 12; i++) { const a = i * TAU / 12; line(ctx, x + Math.sin(a) * r * .72, y - Math.cos(a) * r * .72, x + Math.sin(a) * r * .8, y - Math.cos(a) * r * .8, r * .04, rgba(hand, .7)); }
  const ha = ((h % 12) + m / 60) * TAU / 12, ma = (m / 60) * TAU;
  line(ctx, x, y, x + Math.sin(ha) * r * .45, y - Math.cos(ha) * r * .45, r * .09, hand);
  line(ctx, x, y, x + Math.sin(ma) * r * .68, y - Math.cos(ma) * r * .68, r * .06, hand);
  if (sec != null) { const sa = sec / 60 * TAU; line(ctx, x - Math.sin(sa) * r * .15, y + Math.cos(sa) * r * .15, x + Math.sin(sa) * r * .74, y - Math.cos(sa) * r * .74, r * .025, o.sec || O.alarm); }
  circ(ctx, x, y, r * .06, hand);
}
function bubble(ctx, x, y, w, h, tailX, tailY, col = '#fff', stroke = null) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2);
  ctx.moveTo(tailX - 22, y + h - 2); ctx.lineTo(tailX, tailY); ctx.lineTo(tailX + 18, y + h - 2);
  ctx.fillStyle = col; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 4; ctx.stroke(); }
}
/* urządzenie z ekranem; bar=true → fioletowy pasek z logo (zawsze w nowym świecie) */
function device(ctx, x, y, w, h, o = {}) {
  const b = o.bezel ?? 18, r = o.r ?? 56;
  if (o.shadow !== false) { ctx.save(); ctx.fillStyle = 'rgba(59,20,66,.16)'; rr(ctx, x + 16, y + 26, w, h, r); ctx.fill(); ctx.restore(); }
  fillRR(ctx, x, y, w, h, r, o.frame || '#2A0F30');
  const sx = x + b, sy = y + b, sw = w - 2 * b, sh = h - 2 * b;
  fillRR(ctx, sx, sy, sw, sh, Math.max(4, r - b), o.screen || '#fff');
  let barH = 0;
  if (o.bar) {
    barH = o.barH || 96;
    ctx.save(); rr(ctx, sx, sy, sw, sh, Math.max(4, r - b)); ctx.clip();
    ctx.fillStyle = N.purple; ctx.fillRect(sx, sy, sw, barH);
    const ls = o.logoSize || barH * .36;
    const lw_ = logo(ctx, sx + barH * .32, sy + barH / 2, ls, N.teal, '#fff', 'left');
    if (o.title) txt(ctx, o.title, o.titleRight ? sx + sw - barH * .32 : sx + barH * .32 + lw_ + ls * .7, sy + barH / 2 + ls * .3, ls * .78, 400, 'rgba(255,255,255,.85)', o.titleRight ? 'right' : 'left');
    ctx.restore();
  }
  return { x: sx, y: sy + barH, w: sw, h: sh - barH, top: sy };
}
function pill(ctx, x, y, w, h, bg, label, size, fg, weight = 600) { fillRR(ctx, x, y, w, h, h / 2, bg); if (label) txt(ctx, label, x + w / 2, y + h / 2 + size * .36, size, weight, fg, 'center'); }

/* ---------- postacie ---------- */
function hairBack(ctx, r, o) {
  if (o.hair === 'long') { fillRR(ctx, -r * 1.1, -r * 1.06, r * 2.2, r * (o.back ? 2.5 : 2.15), [r, r, r * .35, r * .35], o.hairCol); }
}
function hairFront(ctx, r, o) {
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r * 1.06, 0, TAU); ctx.clip();
  ctx.fillStyle = o.hairCol;
  if (o.back) { ctx.fillRect(-r * 1.2, -r * 1.2, r * 2.4, r * (o.hair === 'long' ? 2.4 : 1.95)); ctx.restore(); }
  else {
    if (o.hair === 'long') poly(ctx, [[-r * 1.2, -r * 1.2], [r * 1.2, -r * 1.2], [r * 1.2, -r * .05], [r * .82, -r * .32], [r * .15, -r * .52], [-r * .5, -r * .38], [-r * 1.2, r * .1]]);
    else poly(ctx, [[-r * 1.2, -r * 1.2], [r * 1.2, -r * 1.2], [r * 1.2, -r * .3], [r * .7, -r * .5], [0, -r * .6], [-r * .75, -r * .45], [-r * 1.2, -r * .2]]);
    ctx.fill(); ctx.restore();
  }
  if (o.hair === 'cap' && !o.noHat) {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r * 1.07, 0, TAU); ctx.clip(); ctx.fillStyle = o.hatCol; ctx.fillRect(-r * 1.2, -r * 1.2, r * 2.4, r * .82); ctx.restore();
    fillRR(ctx, -r * .95, -r * .44, r * 1.9, r * .2, r * .1, shade(o.hatCol, -.18));
    if (!o.back) fillRR(ctx, -r * .1, -r * .46, r * 1.25, r * .2, r * .1, shade(o.hatCol, -.28));
  }
  if (o.hair === 'hard') {
    ctx.fillStyle = o.hatCol; ctx.beginPath(); ctx.ellipse(0, -r * .32, r * 1.04, r * .92, 0, Math.PI, TAU); ctx.fill();
    fillRR(ctx, -r * 1.3, -r * .4, r * 2.6, r * .2, r * .1, shade(o.hatCol, -.12));
    fillRR(ctx, -r * .1, -r * 1.2, r * .2, r * .8, r * .1, shade(o.hatCol, .2));
  }
}
function face(ctx, r, o) {
  const f = o.face || {}, ink = o.ink, lx = (f.lx || 0) * r, ly = (f.ly || 0) * r;
  const ex = r * .34, ey = -r * .02 + ly;
  const eyes = f.eyes || 'open';
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap = 'round'; ctx.lineWidth = r * .07;
  for (const sx of [-1, 1]) {
    const x = sx * ex + lx;
    if (eyes === 'open') circ(ctx, x, ey, r * .085, ink);
    else if (eyes === 'closed') { ctx.beginPath(); ctx.arc(x, ey - r * .03, r * .12, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
    else if (eyes === 'happy') { ctx.beginPath(); ctx.arc(x, ey + r * .06, r * .12, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke(); }
    else if (eyes === 'half') { line(ctx, x - r * .12, ey, x + r * .12, ey, r * .06, ink); circ(ctx, x, ey + r * .05, r * .05, ink); }
  }
  if (f.brows === 'sad') for (const sx of [-1, 1]) line(ctx, sx * ex + lx - sx * r * .13, ey - r * .3, sx * ex + lx + sx * r * .12, ey - r * .2, r * .05, ink);
  if (o.cheeks) for (const sx of [-1, 1]) circ(ctx, sx * r * .52 + lx, r * .22 + ly, r * .12, 'rgba(240,120,110,.28)');
  const my = r * .4 + ly, mw = r * (f.mw || .3);
  ctx.lineWidth = r * .07;
  switch (f.mouth || 'flat') {
    case 'sad': ctx.beginPath(); ctx.arc(lx, my + mw * .9, mw, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); break;
    case 'smile': ctx.beginPath(); ctx.arc(lx, my - mw * .7, mw, .2 * Math.PI, .8 * Math.PI); ctx.stroke(); break;
    case 'laugh': ctx.beginPath(); ctx.arc(lx, my - r * .08, mw * 1.05, 0, Math.PI); ctx.closePath(); ctx.fillStyle = ink; ctx.fill(); break;
    case 'o': ring(ctx, lx, my, r * .08, r * .05, ink); break;
    case 'none': break;
    default: line(ctx, lx - mw * .6, my, lx + mw * .6, my, r * .06, ink);
  }
}
/* o: x, y (stopy), s (skala), wygląd z CH, face, tilt, hdx/hdy (przesunięcie głowy), dy (ciało), seated, back,

  fillRR(ctx, 40, 820, 210, 110, 14, '#E3A43A'); fillRR(ctx, 110, 720, 110, 110, 10, 'rgba(255,255,255,.6)'); ctx.strokeStyle = '#E3A43A'; ctx.lineWidth = 10; rr(ctx, 110, 720, 110, 110, 10); ctx.stroke();
  line(ctx, 20, 690, 20, 940, 10, NEWINK);
  ctx.fillStyle = NEWINK; ctx.fillRect(-140, 905 - lift, 160, 12);
  pallet(ctx, -150, 905 - lift, 160, '#C9A36E'); bricksStack(ctx, -150, 879 - lift, 160, 3);
  for (const wx of [90, 210]) { circ(ctx, wx, 940, 32, '#2A1530'); circ(ctx, wx, 940, 12, '#BFB2C2'); }
  ctx.restore();
  const s = 1.55;
  person(ctx, Object.assign(who('sprzedawca', 'new'), { x: 800, y: 1000, s, cheeks: true, face: { eyes: 'open', mouth: 'smile' } }));
  counter(ctx, 140, 1150, 780, N.purple);
  const sc = device(ctx, 900, 600, 230, 170, { bar: true, barH: 30, r: 10, bezel: 8, logoSize: 13, shadow: false });
  check(ctx, sc.x + 40, sc.y + 50, 22);
  ctx.restore();
};

/* 12: wszyscy w jednym miejscu */
const NEW_TILES = t => [['07A', 2.0 + t * .3], ['09A', .6 + t * .4], ['10B', 2.2 + t * .5], ['11B', 1.6 + t * .5]];
const PHONES = [[1180, 650], [1190, 748], [1150, 870], [1015, 680]];   // telefony/monitory w ujęciach (współrzędne kafelka 1920×1080)
const tilePt = (i, p) => { const sc = TW / W; return [TILE[i][0] + p[0] * sc, TILE[i][1] + (p[1] - (H - TH / sc) / 2) * sc]; };
function phoneNet(ctx, u, a = 1) {
  const pts = PHONES.map((p, i) => tilePt(i, p)), hub = [960, 548];
  ctx.save(); ctx.globalAlpha = a;
  pts.forEach((p, i) => {
    const t0 = cue('12A', i), k = E.inOutCubic(P(u, t0 - .2, t0 + .4));
    if (k <= 0) return;
    ctx.strokeStyle = N.teal; ctx.lineWidth = 9; ctx.lineCap = 'round';
    const cp = [lerp(p[0], hub[0], .5) + (i % 2 ? -120 : 120), lerp(p[1], hub[1], .5)];
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    const N_ = 30; for (let j = 1; j <= N_ * k; j++) { const t = j / N_, q = [(1 - t) * (1 - t) * p[0] + 2 * (1 - t) * t * cp[0] + t * t * hub[0], (1 - t) * (1 - t) * p[1] + 2 * (1 - t) * t * cp[1] + t * t * hub[1]]; ctx.lineTo(q[0], q[1]); }
    ctx.stroke();
    const nk = E.outBack(P(u, t0 - .2, t0 + .1)); circ(ctx, p[0], p[1], 22 * nk, '#fff'); ring(ctx, p[0], p[1], 22 * nk, 7, N.teal);
  });
  const hk = E.outBack(P(u, .9, 1.5));
  if (hk > 0) { circ(ctx, hub[0], hub[1], 64 * hk, N.purple); ring(ctx, hub[0], hub[1], 64 * hk, 8, N.teal); tri(ctx, hub[0], hub[1] + 4, 30 * hk, N.teal, .18); }
  ctx.restore();
}
SH['12A'] = (ctx, u, d) => {
  tiles(ctx, NEW_TILES(u), u, [0, .08, .16, .24], N.paper);
  phoneNet(ctx, u);
};
function purpleGrid(ctx) { grid(ctx, N.purple, rgba('#ffffff', .06), rgba('#ffffff', .11), 48); }
SH['12B'] = (ctx, u, d) => {
  const sh = E.inOutCubic(P(u, 0, .7)), col = E.inOutCubic(P(u, .75, 1.5));
  purpleGrid(ctx);
  const hub = [960, 540];
  const nodes = Array.from({ length: 8 }, (_, i) => { const a = -Math.PI / 2 + i * TAU / 8 + .4; return [hub[0] + Math.cos(a) * 400, hub[1] + Math.sin(a) * 360]; });
  // kafelki kurczą się do węzłów sieci
  if (sh < 1) {
    ctx.save(); ctx.globalAlpha = 1 - sh;
    TILE.forEach(([x, y], i) => { const n = nodes[[7, 1, 5, 3][i]], cx = lerp(x + TW / 2, n[0], sh), cy = lerp(y + TH / 2, n[1], sh), k = lerp(1, .05, sh);
      const [id, uu] = NEW_TILES(SHOT['12A'].dur + u)[i];
      ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-TW / 2, -TH / 2);
      rr(ctx, 0, 0, TW, TH, 14 / Math.max(k, .2)); ctx.clip();
      const sc = TW / W; ctx.scale(sc, sc); ctx.translate(0, -(H - TH / sc) / 2);
      SH[id](ctx, uu, SHOT[id].dur); ctx.restore(); });
    ctx.restore();
  }
  const R = lerp(1, 0, col);
  nodes.forEach(([x, y], i) => {
    const nx = lerp(hub[0], x, R), ny = lerp(hub[1], y, R), k = clamp(sh * 1.3 - (i % 2) * .2) * (1 - E.inQuad(col));
    line(ctx, hub[0], hub[1], nx, ny, 6, rgba(N.teal, .9 * (1 - col)));
    if (i % 2) circ(ctx, nx, ny, 16 * k, N.teal);
    else { circ(ctx, nx, ny, 34 * k, '#fff'); fillRR(ctx, nx - 10 * k, ny - 17 * k, 20 * k, 34 * k, 5 * k, NEWINK); }
  });
  const hr = lerp(110, 0, col);
  circ(ctx, hub[0], hub[1], hr, N.purple); ring(ctx, hub[0], hub[1], hr, 9 * (1 - col), N.teal);
  // logo: trójkąt w środku, potem pełny znak
  const wk = E.outCubic(P(u, 1.35, d));
  if (wk <= 0) tri(ctx, hub[0], hub[1] + 6, 52, N.teal, .18);
  else { ctx.save(); ctx.globalAlpha = 1; logo(ctx, 960, 540, lerp(80, 120, wk), N.teal, rgba('#ffffff', wk)); ctx.restore(); }
};
SH['12C'] = (ctx, u, d) => {
  purpleGrid(ctx);
  const up = E.inOutCubic(P(u, 0, .7));
  logo(ctx, 960, lerp(540, 400, up), 120, N.teal, '#fff');
  const a = E.outCubic(P(u, .35, .9));
  ctx.globalAlpha = a; txt(ctx, 'Nie czekaj. Zapisz się już dziś.', 960, 600 + (1 - a) * 30, 60, 600, '#fff', 'center'); ctx.globalAlpha = 1;
  const b = E.outBack(P(u, .7, 1.2));
  if (b > 0) {
    const pulse = 1 + .03 * Math.sin(Math.max(0, u - 1.2) * 3.2);
    ctx.save(); popScale(ctx, b * pulse, 960, 715);
    glow(ctx, 960, 715, 300, N.teal, .25 * (.6 + .4 * Math.sin(u * 3.2)));
    pill(ctx, 750, 668, 420, 94, N.teal, 'budoexpert.pl', 44, N.purple, 700); ctx.restore();
  }
};

/* ---------- montaż ---------- */
const SHOT = {}; window.TL.shots.forEach(s => SHOT[s.id] = s);
const SHOTS = window.TL.shots;
const OLDW = new Set(['00B', '01A', '01B', '02A', '02B', '03A', '03B', '03C', '04A', '04B', '05A', '05B', '06A', '06B']);
function shotAt(t) { let s = SHOTS[0]; for (const x of SHOTS) if (t >= x.start) s = x; return s; }
const GRAIN = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256), r = rng(9);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; })();
function post(ctx, t, s) {
  const u = t - s.start;
  if (OLDW.has(s.id)) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 450, W / 2, H / 2, 1250); g.addColorStop(0, 'rgba(20,24,30,0)'); g.addColorStop(1, 'rgba(20,24,30,.38)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  const r = rng(Math.floor(t * FPS) + 1); ctx.translate(-r() * 256, -r() * 256); ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
  if (SUBS) {
    const v = window.TL.vo.find(l => t >= l.at && t < l.at + l.dur + .35);
    if (v) { const w = tw(ctx, v.text, 40, 500) + 60; fillRR(ctx, W / 2 - w / 2, H - 118, w, 68, 14, 'rgba(20,10,25,.62)'); txt(ctx, v.text, W / 2, H - 70, 40, 500, '#fff', 'center'); }
  }
  // fade-in na samym początku (pętla targowa)
  if (t < .3) { ctx.fillStyle = `rgba(255,248,240,${1 - t / .3})`; ctx.fillRect(0, 0, W, H); }
}
function renderScene(ctx, t) {
  const s = shotAt(t), u = t - s.start;
  ctx.save(); SH[s.id](ctx, u, s.dur); ctx.restore();
  return s;
}
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const scn = mk(), sctx = scn.getContext('2d'), acc = mk(), actx = acc.getContext('2d');
function frame(t, samples = 1, shutter = .5) {
  const s0 = shotAt(t), end = s0.start + s0.dur - 1e-4;
  for (let i = 0; i < samples; i++) {
    const ts = Math.min(end, t + (samples > 1 ? (i / samples) * shutter / FPS : 0));
    sctx.setTransform(1, 0, 0, 1, 0, 0); renderScene(sctx, ts);
    actx.globalAlpha = 1 / (i + 1); actx.drawImage(scn, 0, 0);
  }
  actx.globalAlpha = 1;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.drawImage(acc, 0, 0);
  post(octx, t, s0);
}

/* ---------- start ---------- */
const EXPORT = Q.has('export');
window.renderFrameData = (f, samples = 2, q = .95) => { frame(f / FPS, samples); return out.toDataURL('image/jpeg', q); };
window.renderAt = (t, samples = 2) => { frame(t, samples); return true; };
window.DUR = DUR; window.FPS = FPS;
Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 100px Poppins`, 'AaĄąĘęŁłŃńÓóŚśŹźŻż…?!0–„”'))).then(() => document.fonts.ready).then(() => {
  window.ready = true;
  if (EXPORT) { document.getElementById('hint').remove(); return; }
  let t0 = performance.now(), paused = false, pt = +(Q.get('t') || 0);
  if (Q.get('t')) { paused = true; }
  const now = () => paused ? pt : ((performance.now() - t0) / 1000) % DUR;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { if (paused) { t0 = performance.now() - pt * 1000; paused = false; } else { pt = now(); paused = true; } }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const dd = e.code === 'ArrowRight' ? 1 : -1; const n = (now() + dd + DUR) % DUR; if (paused) pt = n; else t0 = performance.now() - n * 1000; }
  });
  out.addEventListener('click', () => { t0 = performance.now(); paused = false; });
  const loop = () => { frame(now(), 1); requestAnimationFrame(loop); };
  loop();
});
