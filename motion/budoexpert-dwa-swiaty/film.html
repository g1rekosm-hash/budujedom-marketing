<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dwa światy budowania</title>
<link rel="stylesheet" href="../budoexpert-promo/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; display: block; }
  #hint { position: fixed; bottom: 12px; left: 16px; color: #ffffff80; font: 12px Poppins, sans-serif; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">spacja: pauza · ←/→: przewijanie · klik: restart</div>
<script src="timeline.js"></script>
<script>
/* Dźwięki zsynchronizowane z obrazem: [czas od początku ujęcia, nazwa, (długość)].
   soundtrack.py czyta ten blok, więc to jedyne miejsce, gdzie są te czasy. */
const CUES = /*CUES*/{
  "00A": [[0.1, "pencil", 3.3], [0.3, "pianoWarm"]],
  "00B": [[0.0, "drops", 3.4]],
  "01B": [[2.4, "sigh"]],
  "02A": [[0.0, "lampHum", 3.2]],
  "02B": [[0.6, "hit"], [1.2, "hit"], [1.8, "hit"]],
  "03A": [[0.7, "calc"], [0.95, "calc"], [1.15, "calc"], [1.3, "calc"], [2.6, "scribble", 1.3]],
  "03B": [[0.0, "childBreath", 3.0]],
  "03C": [[0.5, "sent"]],
  "04B": [[0.15, "phoneTone", 1.1], [1.0, "counter", 2.6]],
  "05A": [[2.6, "whoosh"]],
  "05B": [[0.25, "bell"], [3.0, "doorShut"]],
  "06B": [[0.8, "ding"]],
  "06C": [[0.0, "swell"]],
  "07A": [[1.1, "pop"]],
  "07B": [[1.6, "popCheck"], [2.5, "msgDing"]],
  "08A": [[0.4, "bright"], [0.8, "bright"], [1.2, "bright"], [2.2, "pop"]],
  "08B": [[0.8, "clap"]],
  "09A": [[0.0, "plane", 2.4], [1.2, "buzz", 1.5]],
  "09B": [[1.4, "tap"], [1.55, "confirm"]],
  "09C": [[0.6, "clink"], [1.8, "clink"], [2.6, "clink"]],
  "10A": [[0.0, "truck", 1.7], [0.3, "birds", 3.5], [1.7, "hiss"]],
  "10B": [[0.6, "popCheck"]],
  "11A": [[0.4, "msgDing"], [2.5, "click"], [2.55, "popCheck"]],
  "11B": [[0.4, "beep"], [1.1, "beep"]],
  "12A": [[0.5, "plink"], [0.8, "plink"], [1.1, "plink"], [1.4, "plink"]],
  "12B": [[0.0, "whoosh"], [0.9, "chordHit"]]
}/*END*/;
const cue = (id, i) => CUES[id][i][0];
const SH = {};
</script>
<script src="engine.js"></script>
<script src="scenes-old.js"></script>
<script src="scenes-new.js"></script>
<script>
/* =====================================================================
   BUDOEXPERT — „Dwa światy budowania” · 1920×1080 · 25 kl/s · bez lektora
   Montaż: oś czasu z timeline.js, ujęcia SH[id](ctx, u, d) w scenes-old.js / scenes-new.js
   ===================================================================== */
const FPS = window.TL.fps, DUR = window.TL.dur;
const Q = new URLSearchParams(location.search);
const SHOT = {}; window.TL.shots.forEach(s => SHOT[s.id] = s);
const SHOTS = window.TL.shots;
const OLDW = new Set(['01A', '01B', '02A', '02B', '03A', '03B', '03C', '04A', '04B', '05A', '05B', '06A', '06B']);
/* przejścia: przenikanie z poprzedniego ujęcia na początku danego ujęcia (s) */
const TRANS = { '01A': .5, '03B': .35 };
function shotAt(t) { let s = SHOTS[0]; for (const x of SHOTS) if (t >= x.start) s = x; return s; }
const prevOf = s => SHOTS[SHOTS.indexOf(s) - 1];

const GRAIN = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256), r = rng(9);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; })();
const small = document.createElement('canvas'); small.width = 480; small.height = 270; const sg = small.getContext('2d');
const isOld = (s, u) => OLDW.has(s.id) || (s.id === '00B' && u > 1.2);
/* color grading, bloom, winieta, ziarno */
function post(ctx, t, s, src) {
  const old = isOld(s, t - s.start);
  sg.drawImage(src, 0, 0, 480, 270);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = old ? .2 : .3;
  ctx.filter = `blur(16px) brightness(${old ? .75 : .9}) contrast(2.4)`; ctx.drawImage(small, 0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = old ? lin(ctx, 0, 0, 0, H, [[0, 'rgba(120,150,190,.5)'], [1, 'rgba(30,50,80,.6)']]) : lin(ctx, 0, 0, W, H, [[0, 'rgba(255,196,130,.4)'], [1, 'rgba(150,50,140,.25)']]);
  ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.fillStyle = rad(ctx, W / 2, H / 2, 420, 1250, [[0, 'rgba(0,0,0,0)'], [1, old ? 'rgba(6,10,16,.6)' : 'rgba(70,20,60,.3)']]); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = old ? .075 : .05; ctx.globalCompositeOperation = 'overlay';
  const r = rng(Math.floor(t * FPS) + 1); ctx.translate(-r() * 256, -r() * 256); ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
  if (t < .4) { ctx.fillStyle = `rgba(12,9,6,${1 - t / .4})`; ctx.fillRect(0, 0, W, H); }
}
function renderScene(ctx, t) {
  const s = shotAt(t), u = t - s.start;
  ctx.save(); (SH[s.id] || ((c) => { c.fillStyle = '#222'; c.fillRect(0, 0, W, H); txt(c, s.id, 960, 560, 80, 700, '#666', 'center'); }))(ctx, u, s.dur); ctx.restore();
  const td = TRANS[s.id];
  if (td && u < td) {
    const p = prevOf(s), b = getBuf(1);
    b.g.save(); SH[p.id](b.g, p.dur + u, p.dur); b.g.restore();
    ctx.save(); ctx.globalAlpha = 1 - E.inOutSine(u / td); ctx.drawImage(b.c, 0, 0); ctx.restore(); relBuf();
  }
  return s;
}
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const scn = mk(), sctx = scn.getContext('2d'), acc = mk(), actx = acc.getContext('2d');
const SAMPLES = { '00A': 5, '06C': 3, '10A': 3, '12B': 3 };   // więcej próbek motion blur przy szybkim ruchu
function frame(t, samples = 1, shutter = .5) {
  const s0 = shotAt(t), end = s0.start + s0.dur - 1e-4;
  samples = Math.max(samples, SAMPLES[s0.id] || 1);
  for (let i = 0; i < samples; i++) {
    const ts = Math.min(end, t + (samples > 1 ? (i / samples) * shutter / FPS : 0));
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, W, H); bufTop = 0; renderScene(sctx, ts);
    actx.globalAlpha = 1 / (i + 1); actx.drawImage(scn, 0, 0);
  }
  actx.globalAlpha = 1;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.drawImage(acc, 0, 0);
  post(octx, t, s0, acc);
}
const EXPORT = Q.has('export');
window.renderFrameData = (f, samples = 1, q = .95) => { frame(f / FPS, samples); return out.toDataURL('image/jpeg', q); };
window.renderAt = (t, samples = 1) => { frame(t, samples); return true; };
window.DUR = DUR; window.FPS = FPS;
Promise.all([300, 400, 500, 600, 700, 800].map(w => document.fonts.load(`${w} 100px Poppins`, 'AaĄąĘęŁłŃńÓóŚśŹźŻż…?!0–„”'))).then(() => document.fonts.ready).then(() => {
  window.ready = true;
  if (EXPORT) { document.getElementById('hint').remove(); return; }
  let t0 = performance.now(), paused = !!Q.get('t'), pt = +(Q.get('t') || 0);
  const now = () => paused ? pt : ((performance.now() - t0) / 1000) % DUR;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { if (paused) { t0 = performance.now() - pt * 1000; paused = false; } else { pt = now(); paused = true; } }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const dd = e.code === 'ArrowRight' ? 1 : -1; const n = (now() + dd + DUR) % DUR; if (paused) pt = n; else t0 = performance.now() - n * 1000; }
  });
  out.addEventListener('click', () => { t0 = performance.now(); paused = false; });
  const loop = () => { frame(now(), 1); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
</html>
