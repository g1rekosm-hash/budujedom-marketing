<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUDUJEDOM Showreel</title>
<style>
  @font-face { font-family: "Archivo"; src: url(fonts/archivo-latin.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; font-display: block; }
  @font-face { font-family: "Archivo"; src: url(fonts/archivo-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+A720-A7FF; font-display: block; }
  @font-face { font-family: "Space Mono"; src: url(fonts/spacemono-400-latin.woff2) format("woff2"); font-weight: 400; unicode-range: U+0000-00FF, U+2000-206F, U+2192; }
  @font-face { font-family: "Space Mono"; src: url(fonts/spacemono-400-latin-ext.woff2) format("woff2"); font-weight: 400; unicode-range: U+0100-02BA; }
  @font-face { font-family: "Space Mono"; src: url(fonts/spacemono-700-latin.woff2) format("woff2"); font-weight: 700; unicode-range: U+0000-00FF, U+2000-206F, U+2192; }
  @font-face { font-family: "Space Mono"; src: url(fonts/spacemono-700-latin-ext.woff2) format("woff2"); font-weight: 700; unicode-range: U+0100-02BA; }
  :root { --bg: #070d16; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; display: block; }
  #hint { position: fixed; bottom: 12px; left: 16px; color: #F3ECDF80; font: 12px "Space Mono", monospace; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">spacja: pauza · ←/→: przewijanie · klik: restart</div>
<script>
/* =====================================================================
   BUDUJEDOM — MOTION SHOWREEL 2026 (15 s, 1920×1080, 60 fps)
   Całość to jeden deterministyczny render(t): ta sama klatka zawsze
   wygląda identycznie, więc da się ją wyrenderować do MP4 klatka po klatce
   (patrz render.mjs). Paletę i fonty podmieniasz w CFG poniżej.
   ===================================================================== */
const CFG = {
  W: 1920, H: 1080, FPS: 60, DUR: 15,
  C: {
    ink:    '#0E1B2C',  // granat — tło
    ink2:   '#16283F',
    line:   '#2B4566',  // linie blueprintu
    accent: '#FF6A1A',  // pomarańcz budowlany
    accent2:'#FFB627',  // żółć
    paper:  '#F3ECDF',  // beż / papier
  },
  font: 'Archivo',
  mono: 'Space Mono',
  brand: ['BUDUJE', 'DOM'],
  tagline: 'Zmieniamy rynek budowlany. Na zawsze.',
};
const { W, H, C } = CFG;

/* ---------- math & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: (x, s = 1.70158) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
  spring: (x, f = 4.5, d = 5.5) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-d * x) * Math.cos(f * Math.PI * x),
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const beatPulse = (t, beats, k = 10) => { let v = 0; for (const b of beats) if (t >= b) v = Math.max(v, Math.exp(-(t - b) * k)); return v; };

/* ---------- canvas helpers ---------- */
function font(ctx, size, weight = 900, stretch = 'normal', fam = CFG.font) {
  ctx.font = `${weight} ${size}px "${fam}"`;
  ctx.fontStretch = stretch;
  ctx.letterSpacing = '0px';
}
function layout(ctx, str) {
  const out = [];
  for (let i = 0; i < str.length; i++) out.push({ ch: str[i], x: ctx.measureText(str.slice(0, i)).width, w: ctx.measureText(str[i]).width });
  out.total = ctx.measureText(str).width;
  return out;
}
function dashLine(ctx, pts, p, closed = false) {
  if (p <= 0) return;
  const q = closed ? [...pts, pts[0]] : pts;
  let len = 0; for (let i = 1; i < q.length; i++) len += Math.hypot(q[i][0] - q[i - 1][0], q[i][1] - q[i - 1][1]);
  ctx.save(); ctx.setLineDash([len * p, len + 1]); ctx.beginPath();
  q.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.stroke(); ctx.restore();
}
function poly(ctx, pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
function ring(ctx, x, y, r, lw, color) { if (r <= 0 || lw <= 0) return; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
function dot(ctx, x, y, r, color) { if (r <= 0) return; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }

/* ---------- camera shake on hits ---------- */
const IMPACTS = [[0.5, 5], [1.0, 14], [1.5, 4], [3.5, 12], [5.0, 12], [7.0, 6], [9.0, 12], [11.0, 9], [12.5, 26]];
function shake(t) {
  let a = 0; for (const [ti, A] of IMPACTS) if (t >= ti) a += A * Math.exp(-(t - ti) * 9);
  return { x: a * Math.sin(t * 93.1) * Math.cos(t * 41.7), y: a * Math.cos(t * 77.3) * Math.sin(t * 29.9 + 1), r: a * 0.0007 * Math.sin(t * 61.3) };
}
function camera(ctx, t, s = 1, fx = W / 2, fy = H / 2) {
  const k = shake(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2 + k.x, H / 2 + k.y); ctx.rotate(k.r); ctx.scale(s, s); ctx.translate(-fx, -fy);
}

/* =====================================================================
   SCENE A · 0.0–3.5 · piłka → blueprint → dom z cegieł → zoom w okno
   ===================================================================== */
const HOUSE = { x0: 700, x1: 1220, top: 460, g: 760, door: [900, 600, 120, 160], win: [760, 540, 100, 80], roof: [[650, 470], [960, 250], [1270, 470]], chim: [1110, 296, 50, 80] };
const BRICKS = (() => {
  const r = rng(7), out = [];
  for (let row = 0; row < 10; row++) {
    const y = HOUSE.g - (row + 1) * 30, off = row % 2 ? -32 : 0;
    for (let x = HOUSE.x0 + off; x < HOUSE.x1; x += 65) out.push({ x, y, row, d: r() * 0.07, shade: r() });
  }
  return out;
})();
function sceneA(ctx, t) {
  const H0 = HOUSE;
  // camera: slow push, then whip-zoom into the window
  const zp = P(t, 3.12, 3.5), push = lerp(1, 1.12, E.inOutCubic(P(t, 1.5, 3.2)));
  const wx = H0.win[0] + H0.win[2] / 2, wy = H0.win[1] + H0.win[3] / 2;
  const s = push * Math.exp(E.inExpo(zp) * Math.log(30));
  const fe = E.inOutCubic(clamp(zp * 1.6));
  camera(ctx, t, s, lerp(W / 2, wx, fe), lerp(H / 2, wy, fe));

  ctx.fillStyle = C.ink; ctx.fillRect(-W, -H, W * 3, H * 3);

  // blueprint grid
  ctx.lineWidth = 1;
  for (let k = 0; k <= 32; k++) {
    const x = k * 60, d = 1.0 + Math.abs(x - 960) / 960 * 0.45, e = E.outExpo(P(t, d, d + 0.55));
    if (!e) continue;
    ctx.strokeStyle = hexA(C.line, k % 4 ? .45 : .9);
    ctx.beginPath(); ctx.moveTo(x, 540 - 560 * e); ctx.lineTo(x, 540 + 560 * e); ctx.stroke();
  }
  for (let k = 0; k <= 18; k++) {
    const y = k * 60, d = 1.0 + Math.abs(y - 540) / 540 * 0.45, e = E.outExpo(P(t, d, d + 0.55));
    if (!e) continue;
    ctx.strokeStyle = hexA(C.line, k % 4 ? .45 : .9);
    ctx.beginPath(); ctx.moveTo(960 - 980 * e, y); ctx.lineTo(960 + 980 * e, y); ctx.stroke();
  }

  // shockwaves
  const r1 = P(t, 0.5, 0.85); if (r1 > 0 && r1 < 1) ring(ctx, 960, 760, 150 * E.outCubic(r1), 3 * (1 - r1), C.accent);
  const r2 = P(t, 1.0, 1.5); if (r2 > 0 && r2 < 1) { ring(ctx, 960, 760, 700 * E.outExpo(r2), 5 * (1 - r2), C.accent); ring(ctx, 960, 760, 380 * E.outExpo(r2), 3 * (1 - r2), C.paper); }

  // foundation line (the ball "splashes" into it)
  const fl = E.outExpo(P(t, 0.98, 1.5));
  if (fl > 0) { ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(960 - 300 * fl, H0.g); ctx.lineTo(960 + 300 * fl, H0.g); ctx.stroke(); ctx.lineCap = 'butt'; }

  // the ball
  if (t < 1.14) {
    let y, sx = 1, sy = 1, a = 1; const R = 36;
    if (t < 0.5) { const u = t / 0.5; y = lerp(-90, H0.g - R, u * u); sy = 1 + 0.35 * u * u; sx = 1 - 0.15 * u * u; }
    else if (t < 1.0) { const u = (t - 0.5) / 0.5; y = H0.g - R - 280 * 4 * u * (1 - u); const q = 0.45 * Math.exp(-(t - 0.5) * 22) * Math.cos((t - 0.5) * 40); sx = 1 + q; sy = 1 - q; const v = Math.abs(1 - 2 * u); sy *= 1 + 0.25 * v * v * (u > .5); }
    else { const e = E.outCubic(P(t, 1.0, 1.14)); y = H0.g - R * (1 - e); sx = 1 + 5 * e; sy = Math.max(.08, 1 - e); a = 1 - e; }
    ctx.save(); ctx.globalAlpha = a; ctx.translate(960, y + R * (1 - sy)); ctx.scale(sx, sy); dot(ctx, 0, 0, R, C.accent); ctx.restore();
  }

  // house outline — dash draw
  const { x0, x1, top, g } = H0;
  ctx.strokeStyle = C.paper; ctx.lineWidth = 4; ctx.lineJoin = 'miter';
  // chimney sits behind the roof
  const [cx, cy, cw, ch] = H0.chim;
  const chimFill = E.outBack(P(t, 2.75, 3.0));
  if (chimFill > 0) { ctx.fillStyle = C.accent2; ctx.fillRect(cx, cy + ch * (1 - chimFill), cw, ch * chimFill); }
  dashLine(ctx, [[cx, cy + ch], [cx, cy], [cx + cw, cy], [cx + cw, cy + ch]], E.inOutCubic(P(t, 2.0, 2.3)));

  // roof fill (wipe from the left)
  const rf = E.inOutExpo(P(t, 2.6, 2.95));
  if (rf > 0) { ctx.save(); ctx.beginPath(); ctx.rect(640, 240, 640 * rf, 240); ctx.clip(); ctx.fillStyle = C.paper; poly(ctx, H0.roof); ctx.fill(); ctx.restore(); }
  dashLine(ctx, H0.roof, E.inOutCubic(P(t, 1.7, 2.1)), true);

  // bricks (clipped to wall minus door & window)
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, top, x1 - x0, g - top); ctx.rect(...H0.door); ctx.rect(...H0.win); ctx.clip('evenodd');
  for (const b of BRICKS) {
    const d = 2.1 + b.row * 0.07 + b.d, p = P(t, d, d + 0.24);
    if (!p) continue;
    const yo = -70 * (1 - E.outBack(p, 2.2));
    ctx.globalAlpha = Math.min(1, p * 3);
    ctx.fillStyle = b.shade < .15 ? '#E4560C' : b.shade > .88 ? '#FF8340' : C.accent;
    ctx.fillRect(b.x + 2, b.y + 2 + yo, 61, 26);
  }
  ctx.restore();
  ctx.strokeStyle = C.paper; ctx.lineWidth = 4;
  dashLine(ctx, [[x0, g], [x0, top], [x1, top], [x1, g]], E.inOutCubic(P(t, 1.5, 1.9)));

  // door
  const [dx, dy, dw, dh] = H0.door, df = E.outExpo(P(t, 2.55, 2.85));
  if (df > 0) { ctx.fillStyle = C.ink2; ctx.fillRect(dx, dy + dh * (1 - df), dw, dh * df); dot(ctx, dx + dw - 22, dy + 88, 6 * df, C.accent2); }
  ctx.strokeStyle = C.paper; dashLine(ctx, [[dx, g], [dx, dy], [dx + dw, dy], [dx + dw, g]], E.inOutCubic(P(t, 1.9, 2.2)));

  // window — lights flicker on, then we fly into it
  const [wx0, wy0, ww, wh] = H0.win;
  const flick = t < 2.8 ? 0 : t < 2.84 ? 1 : t < 2.88 ? .2 : t < 2.93 ? 1 : t < 2.96 ? .4 : 1;
  if (flick > 0) {
    ctx.fillStyle = hexA(C.paper, flick); ctx.fillRect(wx0, wy0, ww, wh);
    const glow = ctx.createRadialGradient(wx, wy, 10, wx, wy, 220);
    glow.addColorStop(0, hexA(C.accent2, .28 * flick * (1 - zp))); glow.addColorStop(1, hexA(C.accent2, 0));
    ctx.fillStyle = glow; ctx.fillRect(wx - 220, wy - 220, 440, 440);
  }
  ctx.strokeStyle = C.paper; dashLine(ctx, [[wx0, wy0], [wx0 + ww, wy0], [wx0 + ww, wy0 + wh], [wx0, wy0 + wh]], E.inOutCubic(P(t, 2.0, 2.3)), true);
  const mull = clamp(1 - zp * 5) * E.outExpo(P(t, 2.3, 2.5));
  if (mull > 0 && flick > 0) { ctx.strokeStyle = hexA(C.ink, mull); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(wx, wy0); ctx.lineTo(wx, wy0 + wh); ctx.moveTo(wx0, wy); ctx.lineTo(wx0 + ww, wy); ctx.stroke(); }

  // dimension lines (the blueprint detail)
  const dm = E.outExpo(P(t, 1.85, 2.4));
  if (dm > 0) {
    ctx.strokeStyle = C.accent2; ctx.fillStyle = C.accent2; ctx.lineWidth = 2;
    const mx = 960, hw = 260 * dm;
    ctx.beginPath(); ctx.moveTo(mx - hw, 810); ctx.lineTo(mx + hw, 810);
    ctx.moveTo(mx - hw, 798); ctx.lineTo(mx - hw, 822); ctx.moveTo(mx + hw, 798); ctx.lineTo(mx + hw, 822);
    const vy = 610, hh = 150 * dm;
    ctx.moveTo(1300, vy - hh); ctx.lineTo(1300, vy + hh); ctx.moveTo(1288, vy - hh); ctx.lineTo(1312, vy - hh); ctx.moveTo(1288, vy + hh); ctx.lineTo(1312, vy + hh);
    ctx.stroke();
    font(ctx, 22, 700, 'normal', CFG.mono); ctx.globalAlpha = P(t, 2.1, 2.3);
    ctx.textAlign = 'center'; ctx.fillText('10,40 m', mx, 850);
    ctx.save(); ctx.translate(1336, vy); ctx.rotate(-Math.PI / 2); ctx.fillText('3,00 m', 0, 0); ctx.restore();
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  // smoke
  for (let i = 0; i < 7; i++) {
    const st = 2.95 + i * 0.07, p = P(t, st, st + 0.9);
    if (p <= 0 || p >= 1) continue;
    dot(ctx, cx + cw / 2 + Math.sin(i * 2.1 + p * 3) * 20 * p + 40 * p, cy - 10 - p * 170, 10 + 34 * E.outCubic(p), hexA(C.paper, .55 * (1 - p)));
  }
}

/* =====================================================================
   SCENE B · 3.5–5.0 · typografia kinetyczna
   ===================================================================== */
const B_WORDS = [{ s: 'PROJEKTUJ', t: 3.5, c: 'ink' }, { s: 'BUDUJ', t: 3.95, c: 'accent' }, { s: 'ANIMUJ', t: 4.25, c: 'ink' }];
function sceneB(ctx, t) {
  camera(ctx, t, lerp(1.06, 1, E.outExpo(P(t, 3.5, 4.2))));
  ctx.fillStyle = C.paper; ctx.fillRect(-100, -100, W + 200, H + 200);

  // background marquee
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-0.14); ctx.translate(-W / 2, -H / 2);
  font(ctx, 118, 900, 'expanded'); ctx.lineWidth = 2; ctx.strokeStyle = hexA(C.ink, .09);
  const chunk = 'MOTION DESIGN • KINETIC TYPE • ', cw = ctx.measureText(chunk).width;
  for (let r = 0; r < 11; r++) {
    const y = -200 + r * 150, dir = r % 2 ? 1 : -1, off = ((t * 380 * dir + r * 431) % cw + cw) % cw;
    ctx.strokeText(chunk.repeat(4), -off - cw, y);
  }
  ctx.restore();

  // words
  const size = 300, base = 650;
  font(ctx, size, 900, 'condensed');
  B_WORDS.forEach((w, i) => {
    const next = B_WORDS[i + 1];
    if (t < w.t || (next && t > next.t + 0.5)) return;
    const L = layout(ctx, w.s), x0 = W / 2 - L.total / 2;
    ctx.save(); ctx.beginPath(); ctx.rect(0, base - size * 0.82, W, size * 0.92); ctx.clip();
    L.forEach((l, k) => {
      const pin = E.outExpo(P(t, w.t + 0.02 + k * 0.022, w.t + 0.02 + k * 0.022 + 0.32));
      const pout = next ? E.inExpo(P(t, next.t - 0.16 + k * 0.012, next.t + 0.02 + k * 0.012)) : 0;
      const yo = (1 - pin) * size * 0.9 - pout * size * 0.95;
      ctx.fillStyle = C[w.c];
      ctx.fillText(l.ch, x0 + l.x, base + yo);
    });
    // last word: orange fill wipe
    if (!next) {
      const f = E.inOutExpo(P(t, 4.5, 4.72));
      if (f > 0) { ctx.beginPath(); ctx.rect(x0 - 10, 0, (L.total + 20) * f, H); ctx.clip(); ctx.fillStyle = C.accent; L.forEach(l => ctx.fillText(l.ch, x0 + l.x, base)); }
    }
    ctx.restore();
    // underline bar
    const ul = E.outExpo(P(t, w.t + 0.08, w.t + 0.45)), ulo = next ? E.inExpo(P(t, next.t - 0.12, next.t + 0.05)) : 0;
    if (ul > 0 && ulo < 1) { ctx.fillStyle = w.c === 'accent' ? C.ink : C.accent; ctx.fillRect(x0 + L.total * ulo, base + 36, L.total * (ul - ulo), 16); }
  });

  // counter label
  font(ctx, 26, 700, 'normal', CFG.mono); ctx.fillStyle = C.ink;
  const idx = t < 3.95 ? 1 : t < 4.25 ? 2 : 3;
  ctx.fillText(`0${idx} / 03`, W / 2 - 60, 300);

  // iris into orange
  const ir = P(t, 4.7, 5.0);
  if (ir > 0) dot(ctx, W / 2, H / 2, 1150 * E.inOutCubic(ir), C.accent);
}

/* =====================================================================
   SCENE C · 5.0–7.0 · morphing kształtów
   ===================================================================== */
const N_PTS = 180;
function samplePoly(v, n = N_PTS) {
  const L = v.map((a, i) => { const b = v[(i + 1) % v.length]; return Math.hypot(b[0] - a[0], b[1] - a[1]); });
  const tot = L.reduce((a, b) => a + b, 0), out = [];
  for (let k = 0; k < n; k++) {
    let d = k / n * tot, i = 0; while (d > L[i]) d -= L[i++];
    const a = v[i], b = v[(i + 1) % v.length], u = d / L[i]; out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]);
  }
  return out;
}
const SHAPES = {
  circle: Array.from({ length: N_PTS }, (_, k) => { const a = -Math.PI / 2 + TAU * k / N_PTS; return [Math.cos(a), Math.sin(a)]; }),
  square: samplePoly([[0, -.86], [.86, -.86], [.86, .86], [-.86, .86], [-.86, -.86]]),
  star: samplePoly(Array.from({ length: 10 }, (_, k) => { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? .46 : 1.08; return [r * Math.cos(a), r * Math.sin(a)]; })),
  tri: samplePoly([[0, -1.05], [1.1, .78], [-1.1, .78]]),
  house: samplePoly([[0, -1.02], [.92, -.18], [.92, .92], [-.92, .92], [-.92, -.18]]),
};
const MORPH = [[5.0, 'circle'], [5.5, 'square'], [5.75, 'star'], [6.0, 'tri'], [6.5, 'house']];
const C_BEATS = [5.0, 5.5, 5.75, 6.0, 6.5];
function shapeAt(t) {
  let pts = SHAPES.circle, rot = 0;
  for (let i = 1; i < MORPH.length; i++) {
    const [tm, name] = MORPH[i], p = E.outBack(P(t, tm, tm + 0.24), 2.2);
    if (p > 0) { const prev = pts; pts = prev.map((a, k) => [lerp(a[0], SHAPES[name][k][0], p), lerp(a[1], SHAPES[name][k][1], p)]); }
    rot += Math.PI / 2 * E.outBack(P(t, tm - 0.02, tm + 0.3), 1.4);
  }
  const sc = 230 * E.spring(P(t, 4.9, 5.55)) * (1 - E.inBack(P(t, 6.78, 7.0))) * (1 + 0.07 * beatPulse(t, C_BEATS, 12));
  const cr = Math.cos(rot), sr = Math.sin(rot);
  return pts.map(([x, y]) => [W / 2 + (x * cr - y * sr) * sc, H / 2 + (x * sr + y * cr) * sc]);
}
function sceneC(ctx, t) {
  camera(ctx, t, 1 + 0.03 * beatPulse(t, C_BEATS, 8));

  ctx.stroke();
  font(ctx, 18, 700, 'normal', CFG.mono); ctx.fillStyle = hexA(col, a);
  let ch = CHAPTERS[0]; for (const c of CHAPTERS) if (t >= c[0]) ch = c;
  const reveal = Math.floor(ch[1].length * P(t, ch[0], ch[0] + .3));
  ctx.fillText(ch[1].slice(0, reveal), m + 14, m + 30);
  ctx.textAlign = 'right'; ctx.fillText('BUDUJEDOM · REEL ’26', W - m - 14, m + 30);
  const f = Math.floor(t * CFG.FPS + 1e-6), ss = Math.floor(f / 60), ff = f % 60;
  ctx.fillText(`TC 00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, W - m - 14, H - m - 16);
  ctx.textAlign = 'left';
  ctx.fillText('1920×1080 · 60 FPS', m + 40, H - m - 16);
  if (Math.floor(t * 2) % 2 === 0) dot(ctx, m + 22, H - m - 22, 6, hexA(C.accent, .95));
  // progress bar
  ctx.fillStyle = hexA(col, a * .3); ctx.fillRect(m + 300, H - m - 24, W - 2 * m - 620, 2);
  ctx.fillStyle = hexA(C.accent, .9); ctx.fillRect(m + 300, H - m - 24, (W - 2 * m - 620) * t / CFG.DUR, 2);
}
const GLITCH = [3.5, 5.0, 9.0, 11.0, 12.5];
function glitch(ctx, src, t) {
  let g = null; for (const ti of GLITCH) if (t >= ti && t < ti + .07) g = ti;
  if (g === null) return;
  const r = rng(Math.floor(t * 60) * 13 + 5);
  for (let i = 0; i < 9; i++) {
    const y = r() * H, h = 8 + r() * 70, dx = (r() - .5) * 140;
    ctx.drawImage(src, 0, y, W, h, dx, y, W, h);
  }
  ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .35;
  ctx.drawImage(src, 12, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
const GRAIN = (() => {
  const out = [];
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d'), d = x.createImageData(256, 256), r = rng(k * 1000 + 1);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0); out.push(c);
  }
  return out;
})();
function post(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const f = Math.floor(t * CFG.FPS), g = GRAIN[f % GRAIN.length];
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  const ox = (f * 97) % 256, oy = (f * 61) % 256;
  for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) ctx.drawImage(g, x, y);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); const lt = (t >= 3.5 && t < 7.05) || (t >= 11.1 && t < 12.4); v.addColorStop(1, `rgba(0,0,0,${lt ? .16 : .4})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fo = P(t, 14.72, 15.0); if (fo > 0) { ctx.fillStyle = hexA(C.ink, fo); ctx.fillRect(0, 0, W, H); }
}

/* =====================================================================
   compositor: scenes → motion-blur accumulation → glitch → HUD → post
   ===================================================================== */
function renderScene(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t < 3.5) sceneA(ctx, t);
  else if (t < 5.0) sceneB(ctx, t);
  else if (t < 7.0) sceneC(ctx, t);
  else if (t < 9.0) sceneD(ctx, t);
  else if (t < 11.0) { sceneE(ctx, t); if (t >= 10.55) stripeWipe(ctx, t, 10.55); }
  else if (t < 12.5) { sceneF(ctx, t); stripeWipe(ctx, t, 10.55); }
  else sceneG(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const scn = mk(), sctx = scn.getContext('2d'), acc = mk(), actx = acc.getContext('2d');
function frame(t, samples = 1, shutter = .5) {
  // subframes must not cross a hard cut, or both scenes smear into each other
  const CUTS = [3.5, 5.0, 7.0, 9.0, 11.0, 12.5];
  for (let i = 0; i < samples; i++) {
    let ts = t + (samples > 1 ? (i / samples) * shutter / CFG.FPS : 0);
    for (const c of CUTS) if (t < c && ts >= c) ts = c - 1e-4;
    ts = Math.min(ts, CFG.DUR - 1e-4);
    renderScene(sctx, ts);
    actx.globalAlpha = 1 / (i + 1); actx.drawImage(scn, 0, 0);
  }
  actx.globalAlpha = 1;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.drawImage(acc, 0, 0);
  glitch(octx, acc, t);
  hud(octx, t);
  post(octx, t);
}

/* ---------- boot: live player or export mode ---------- */
const EXPORT = new URLSearchParams(location.search).has('export');
window.renderFrameData = (f, samples = 8, q = .96) => { frame(f / CFG.FPS, samples); return out.toDataURL('image/jpeg', q); };
window.renderAt = (t, samples = 8) => { frame(t, samples); return true; };
const fontsReady = Promise.all([
  document.fonts.load(`900 100px "${CFG.font}"`, 'AĄĘŁŃÓŚŹŻ0123456789'),
  document.fonts.load(`500 100px "${CFG.font}"`, 'ąęłńóśźż'),
  document.fonts.load(`700 20px "${CFG.mono}"`, 'AĘŁ0→'),
  document.fonts.load(`400 20px "${CFG.mono}"`, 'A0'),
]).then(() => document.fonts.ready);
fontsReady.then(() => {
  window.ready = true;
  if (EXPORT) { document.getElementById('hint').remove(); return; }
  let t0 = performance.now(), paused = false, pt = 0;
  const now = () => paused ? pt : ((performance.now() - t0) / 1000) % CFG.DUR;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { if (paused) { t0 = performance.now() - pt * 1000; paused = false; } else { pt = now(); paused = true; } }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const d = e.code === 'ArrowRight' ? 1 / 60 : -1 / 60; const n = (now() + (paused ? d : d * 30) + CFG.DUR) % CFG.DUR; if (paused) pt = n; else t0 = performance.now() - n * 1000; }
  });
  out.addEventListener('click', () => { t0 = performance.now(); paused = false; });
  const loop = () => { frame(now(), 2); requestAnimationFrame(loop); };
  loop();
});
</script>
