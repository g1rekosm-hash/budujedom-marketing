# Nadpisuje GitHub Pages pustą stroną (landing został wycofany).
name: Pages takedown

on:
  push:
    branches: [master]
    paths: ['.github/workflows/pages-takedown.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Build placeholder
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strona niedostępna</title></head>
          <body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#fff;color:#555"><p>Strona niedostępna.</p></body></html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
